<svg xmlns="http://www.w3.org/2000/svg" width="860" height="478" viewBox="0 0 860 478" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1f2733; }
    .h { font-size: 13px; font-weight: 700; }
    .lib { font-size: 13.5px; font-weight: 700; fill: #1f2733; font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .m { font-size: 12px; font-weight: 700; fill: #1f2733; font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .sm { font-size: 11px; fill: #3a4452; font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .s { font-size: 11px; fill: #5a6575; }
    .t { font-size: 12.5px; fill: #3a4452; }
    .b { font-size: 12.5px; font-weight: 700; fill: #1f2733; }
    .tag { font-size: 10.5px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="478" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="28" y="40" class="title">ngen-view: picking</text>
  <text x="28" y="62" class="s" style="font-size:12px">A click picks on the GPU: one texel of gbuffer.instance read back after the geometry pass, mapped to a prim path a few frames later.</text>
  <rect x="28" y="92" width="804" height="112" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.45"/>
  <text x="42" y="116" class="h" fill="#2563eb">main thread</text>
  <rect x="28" y="216" width="804" height="92" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-opacity="0.45"/>
  <text x="42" y="240" class="h" fill="#ea580c">render thread</text>
  <rect x="28" y="320" width="804" height="92" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-opacity="0.45"/>
  <text x="42" y="344" class="h" fill="#16a34a">GPU</text>
  <rect x="136" y="126" width="140" height="62" rx="8" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.6"/>
  <text x="146" y="145" class="m">pick(pixel)</text>
  <text x="146" y="162" class="s">a click, pick x y,</text>
  <text x="146" y="176" class="s">or view.pick</text>
  <rect x="292" y="126" width="156" height="62" rx="8" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.6"/>
  <text x="302" y="145" class="m">CaptureWatch</text>
  <text x="302" y="162" class="s">GeometryPass, the 1×1</text>
  <text x="302" y="176" class="s">gbuffer.instance texel</text>
  <rect x="468" y="126" width="150" height="62" rx="8" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.6"/>
  <text x="478" y="145" class="m">onCaptureResult</text>
  <text x="478" y="162" class="s">a few frames later: the</text>
  <text x="478" y="176" class="s">value − 1, an instance</text>
  <rect x="638" y="126" width="168" height="62" rx="8" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.6"/>
  <text x="648" y="145" class="m">instancePath(i)</text>
  <text x="648" y="162" class="s">selectedPath: its prim;</text>
  <text x="648" y="176" class="s">a value of 0 deselects</text>
  <rect x="292" y="238" width="156" height="62" rx="8" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.6"/>
  <text x="302" y="257" class="m">RenderSnapshot</text>
  <text x="302" y="274" class="s">carries the watches</text>
  <text x="302" y="288" class="s">when they change</text>
  <rect x="468" y="238" width="150" height="62" rx="8" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.6"/>
  <text x="478" y="257" class="m">CaptureResult</text>
  <text x="478" y="274" class="s">the texel copied after</text>
  <text x="478" y="288" class="s">the pass, read back</text>
  <rect x="292" y="342" width="326" height="62" rx="8" fill="#ffffff" stroke="#16a34a" stroke-opacity="0.6"/>
  <text x="302" y="361" class="m">GeometryPass</text>
  <text x="302" y="378" class="s">each pixel's instance index + 1 into</text>
  <text x="302" y="392" class="s">gbuffer.instance; 0 where nothing is drawn</text>

  <!-- The flow -->
  <line x1="278" y1="157" x2="290" y2="157" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="370" y1="190" x2="370" y2="236" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="370" y1="302" x2="370" y2="340" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="543" y1="340" x2="543" y2="302" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="543" y1="236" x2="543" y2="190" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="620" y1="157" x2="636" y2="157" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="28" y="440" class="s">ViewPicking (viewpicking.*) holds the pending picks; ViewFrame::readBack adds their watches and takes their results.</text>
  <text x="28" y="458" class="s">A depth pick (the orbit's pivot) reads the depth texel the same way.</text>
</svg>
