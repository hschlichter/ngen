<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1f2733; }
    .h { font-size: 14px; font-weight: 700; fill: #1f2733; }
    .lib { font-size: 13.5px; font-weight: 700; fill: #1f2733; font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .s { font-size: 11px; fill: #5a6575; }
    .t { font-size: 12.5px; fill: #3a4452; }
    .code { font-size: 11px; fill: #334155; font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .edge { font-size: 11px; fill: #334155; font-weight: 600; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="28" y="40" class="title">Trace: from TRACE_EVENT to ngen-introspect</text>
  <text x="28" y="62" class="s" style="font-size:12px">Every event is printed and kept in the process's ring; a stream sends each subscriber what its cursor hasn't read yet.</text>

  <!-- The process -->
  <rect x="28" y="84" width="650" height="380" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.45"/>
  <text x="44" y="108" class="h">ngen-view</text>
  <text x="122" y="108" class="s">each process has its own ring and stream</text>

  <!-- Producer -->
  <rect x="44" y="124" width="190" height="96" rx="8" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.6"/>
  <text x="58" y="146" class="lib">TRACE_EVENT</text>
  <text x="58" y="166" class="t">on any thread</text>
  <text x="58" y="186" class="code">(category, type, name)</text>
  <text x="58" y="204" class="s">pushed at the end of the statement</text>

  <!-- Console -->
  <rect x="44" y="252" width="190" height="84" rx="8" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="58" y="274" class="lib">console</text>
  <text x="58" y="294" class="t">the event's text</text>
  <text x="58" y="312" class="s">info on stdout; warnings and</text>
  <text x="58" y="327" class="s">errors on stderr</text>
  <line x1="139" y1="220" x2="139" y2="250" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="147" y="240" class="edge">printed</text>

  <!-- At exit -->
  <rect x="44" y="368" width="190" height="86" rx="8" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.6"/>
  <text x="58" y="390" class="lib">at exit</text>
  <text x="58" y="410" class="s">after ProcessExiting, the last</text>
  <text x="58" y="425" class="s">events are sent; waits up to</text>
  <text x="58" y="440" class="s">1 s for them to be written</text>

  <!-- Ring -->
  <rect x="258" y="124" width="250" height="160" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="272" y="146" class="lib">TraceRing</text>
  <text x="358" y="146" class="s">tracering.*</text>
  <text x="272" y="166" class="t">the last 65,536 events</text>
  <rect x="272" y="178" width="26" height="22" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="298" y="178" width="26" height="22" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="324" y="178" width="26" height="22" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="350" y="178" width="26" height="22" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="376" y="178" width="26" height="22" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="402" y="178" width="26" height="22" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="428" y="178" width="26" height="22" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="454" y="178" width="26" height="22" fill="#e2e8f0" stroke="#94a3b8" stroke-dasharray="3 2"/>
  <text x="272" y="216" class="s">oldest</text>
  <path d="M363,212 L363,202" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="363" y="224" class="s" text-anchor="middle">a cursor</text>
  <text x="480" y="216" class="s" text-anchor="end">head</text>
  <text x="272" y="244" class="s">a push: a short lock, the next seq, ts_ns</text>
  <text x="272" y="259" class="s">(CLOCK_MONOTONIC) and the thread;</text>
  <text x="272" y="274" class="s">times never decrease with seq</text>
  <line x1="234" y1="172" x2="256" y2="172" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Stream -->
  <rect x="258" y="316" width="250" height="138" rx="8" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.6"/>
  <text x="272" y="338" class="lib">TraceStream</text>
  <text x="372" y="338" class="s">its own thread</text>
  <text x="272" y="358" class="t">every 50 ms, or once 1,024 wait</text>
  <text x="272" y="378" class="s">per subscriber, from its cursor: batches</text>
  <text x="272" y="393" class="s">of at most 4,096 events</text>
  <text x="272" y="414" class="s">over 16 MiB queued on its connection:</text>
  <text x="272" y="429" class="s">nothing sent; what the ring overwrites</text>
  <text x="272" y="444" class="s">meanwhile is counted in dropped</text>
  <line x1="383" y1="284" x2="383" y2="314" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="391" y="304" class="edge">read(cursor, 4096)</text>

  <!-- I/O thread -->
  <rect x="532" y="124" width="130" height="330" rx="8" fill="#ffffff" stroke="#db2777" stroke-opacity="0.6"/>
  <text x="546" y="146" class="lib">I/O thread</text>
  <text x="546" y="164" class="s">RpcServer</text>
  <text x="546" y="198" class="code">trace.subscribe</text>
  <text x="546" y="214" class="code">{since_ns?}</text>
  <text x="546" y="232" class="s">answered here:</text>
  <text x="546" y="248" class="code">{process,</text>
  <text x="546" y="263" class="code"> from, head}</text>
  <text x="546" y="282" class="s">the cursor starts at the</text>
  <text x="546" y="297" class="s">oldest event, or the</text>
  <text x="546" y="312" class="s">first at since_ns</text>
  <text x="546" y="374" class="s">writes each batch:</text>
  <text x="546" y="392" class="code">trace.events</text>
  <text x="546" y="408" class="code">{process,</text>
  <text x="546" y="423" class="code"> dropped, events}</text>
  <line x1="508" y1="382" x2="530" y2="382" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- The asset server -->
  <rect x="28" y="484" width="650" height="52" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-opacity="0.45"/>
  <text x="44" y="506" class="lib">ngen-asset-server</text>
  <text x="44" y="524" class="s">the same ring and stream; each line of its log is an Asset Message event</text>

  <!-- ngen-introspect -->
  <rect x="712" y="84" width="260" height="452" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-opacity="0.45"/>
  <text x="728" y="108" class="lib">ngen-introspect</text>
  <text x="728" y="126" class="s">subscribes to every process in</text>
  <text x="728" y="141" class="s">its working directory</text>

  <rect x="728" y="160" width="228" height="62" rx="8" fill="#ffffff" stroke="#db2777" stroke-opacity="0.6"/>
  <text x="742" y="182" class="t" font-weight="700">the Trace tab</text>
  <text x="742" y="200" class="code">ngen-introspect trace</text>
  <text x="742" y="215" class="s">JSON lines, process added, no seq</text>

  <rect x="728" y="256" width="228" height="62" rx="8" fill="#ffffff" stroke="#db2777" stroke-opacity="0.6"/>
  <text x="742" y="278" class="t" font-weight="700">merged by ts_ns</text>
  <text x="742" y="296" class="s">one clock on the machine, so</text>
  <text x="742" y="311" class="s">processes interleave by time</text>
  <line x1="842" y1="256" x2="842" y2="224" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="728" y="358" width="180" height="48" rx="8" fill="#ffffff" stroke="#db2777" stroke-opacity="0.6"/>
  <text x="742" y="378" class="code">view:&lt;pid&gt;</text>
  <text x="742" y="395" class="s">the view's batches</text>
  <line x1="818" y1="358" x2="818" y2="320" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="728" y="484" width="228" height="40" rx="8" fill="#ffffff" stroke="#db2777" stroke-opacity="0.6"/>
  <text x="742" y="508" class="code">asset:&lt;pid&gt;</text>
  <text x="836" y="508" class="s">its batches</text>
  <path d="M932,484 L932,320" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <line x1="662" y1="382" x2="726" y2="382" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="678" y1="510" x2="726" y2="510" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="710" y1="202" x2="664" y2="202" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>
