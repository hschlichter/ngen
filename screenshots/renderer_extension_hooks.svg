<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="556" viewBox="0 0 1000 556" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1f2733; }
    .h { font-size: 14px; font-weight: 700; fill: #1f2733; }
    .lib { font-size: 13.5px; font-weight: 700; fill: #1f2733; font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .t { font-size: 12.5px; fill: #3a4452; }
    .s { font-size: 11px; fill: #5a6575; }
    .m { font-size: 11px; fill: #334155; font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .mono { font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .edge { font-size: 11.5px; fill: #334155; font-weight: 600; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="556" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="28" y="40" class="title">Extensions: where they join the frame</text>
  <text x="28" y="62" class="s" style="font-size:12px">Renderer::render left to right, the hooks it calls in each extension in the order added, and where their frame data rides.</text>

  <!-- the extensions, in the order added -->
  <rect x="28" y="84" width="944" height="170" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-opacity="0.45"/>
  <text x="44" y="108" class="h">RenderExtension</text>
  <text x="176" y="108" class="s">a dot: the hook it overrides; init and destroy are not per frame</text>
  <text x="176" y="136" class="m" text-anchor="middle">beginFrame</text>
  <line x1="176" y1="142" x2="176" y2="318" stroke="#7c3aed" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="3 3"/>
  <text x="300" y="154" class="m" text-anchor="middle">afterFence</text>
  <line x1="300" y1="160" x2="300" y2="318" stroke="#7c3aed" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="3 3"/>
  <text x="556" y="136" class="m" text-anchor="middle">addOverlayPasses</text>
  <line x1="556" y1="142" x2="556" y2="318" stroke="#7c3aed" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="3 3"/>
  <text x="656" y="154" class="m" text-anchor="middle">beforeExecute</text>
  <line x1="656" y1="160" x2="656" y2="318" stroke="#7c3aed" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="3 3"/>
  <text x="764" y="136" class="m" text-anchor="middle">afterExecute</text>
  <line x1="764" y1="142" x2="764" y2="318" stroke="#7c3aed" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="3 3"/>
  <text x="846" y="154" class="m" text-anchor="middle">afterSubmit</text>
  <line x1="846" y1="160" x2="846" y2="318" stroke="#7c3aed" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="3 3"/>
  <text x="936" y="136" class="m" text-anchor="middle">endFrame</text>
  <line x1="936" y1="142" x2="936" y2="318" stroke="#7c3aed" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="3 3"/>
  <text x="44" y="186" class="lib" style="font-size:12.5px">0 RenderTools</text>
  <circle cx="176" cy="182" r="6" fill="#7c3aed"/>
  <circle cx="300" cy="182" r="6" fill="#7c3aed"/>
  <circle cx="656" cy="182" r="6" fill="#7c3aed"/>
  <circle cx="764" cy="182" r="6" fill="#7c3aed"/>
  <circle cx="846" cy="182" r="6" fill="#7c3aed"/>
  <circle cx="936" cy="182" r="6" fill="#7c3aed"/>
  <text x="44" y="214" class="lib" style="font-size:12.5px">1 GizmoRender</text>
  <circle cx="556" cy="210" r="6" fill="#7c3aed"/>
  <text x="566" y="214" class="s">GizmoPass</text>
  <text x="44" y="242" class="lib" style="font-size:12.5px">2 UiRender</text>
  <circle cx="556" cy="238" r="6" fill="#7c3aed"/>
  <text x="566" y="242" class="s">EditorUIPass</text>

  <!-- Renderer::render, render thread -->
  <rect x="28" y="270" width="944" height="146" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-opacity="0.45"/>
  <text x="44" y="294" class="lib">Renderer::render</text>
  <text x="44" y="312" class="s">render thread, one snapshot</text>
  <rect x="188" y="322" width="100" height="44" rx="7" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.6"/>
  <text x="238" y="341" class="t" text-anchor="middle">wait fence</text>
  <text x="238" y="357" class="s" text-anchor="middle">readbacks</text>
  <rect x="312" y="322" width="68" height="44" rx="7" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.6"/>
  <text x="346" y="341" class="t" text-anchor="middle">acquire</text>
  <text x="346" y="357" class="s" text-anchor="middle">an image</text>
  <rect x="392" y="322" width="180" height="44" rx="7" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.6"/>
  <text x="482" y="341" class="t" text-anchor="middle">build graph</text>
  <text x="482" y="357" class="s" text-anchor="middle">core passes, debug lines</text>
  <rect x="584" y="322" width="60" height="44" rx="7" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.6"/>
  <text x="614" y="349" class="t" text-anchor="middle">compile</text>
  <rect x="668" y="322" width="84" height="44" rx="7" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.6"/>
  <text x="710" y="341" class="t" text-anchor="middle">execute</text>
  <text x="710" y="357" class="s" text-anchor="middle">recorded</text>
  <rect x="776" y="322" width="58" height="44" rx="7" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.6"/>
  <text x="805" y="349" class="t" text-anchor="middle">submit</text>
  <rect x="858" y="322" width="64" height="44" rx="7" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.6"/>
  <text x="890" y="349" class="t" text-anchor="middle">present</text>
  <rect x="173" y="318" width="6" height="52" rx="3" fill="#7c3aed"/>
  <rect x="297" y="318" width="6" height="52" rx="3" fill="#7c3aed"/>
  <rect x="553" y="318" width="6" height="52" rx="3" fill="#7c3aed"/>
  <rect x="653" y="318" width="6" height="52" rx="3" fill="#7c3aed"/>
  <rect x="761" y="318" width="6" height="52" rx="3" fill="#7c3aed"/>
  <rect x="843" y="318" width="6" height="52" rx="3" fill="#7c3aed"/>
  <rect x="933" y="318" width="6" height="52" rx="3" fill="#7c3aed"/>
  <text x="44" y="341" class="s">hooks run</text>
  <text x="44" y="357" class="s">in the order added</text>
  <path d="M346,366 L346,398 L936,398 L936,376" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="356" y="392" class="s">acquire fails (out of date): the frame returns unrecorded; endFrame still runs</text>

  <!-- the frame data, main thread -->
  <rect x="28" y="432" width="944" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.45"/>
  <text x="44" y="456" class="lib">RenderSnapshot::extensions</text>
  <text x="44" y="474" class="s">main thread: each extension&#8217;s side</text>
  <text x="44" y="490" class="s">puts its data at its index()</text>
  <rect x="300" y="452" width="176" height="40" rx="7" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="312" y="477" class="m">[0]</text>
  <text x="340" y="477" class="lib" style="font-size:12.5px">RenderToolsFrame</text>
  <rect x="490" y="452" width="176" height="40" rx="7" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="502" y="477" class="m">[1]</text>
  <text x="530" y="477" class="lib" style="font-size:12.5px">GizmoFrame</text>
  <rect x="680" y="452" width="176" height="40" rx="7" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="692" y="477" class="m">[2]</text>
  <text x="720" y="477" class="lib" style="font-size:12.5px">UiFrame</text>
  <text x="300" y="514" class="s">Arrives with the frame it belongs to; the render-thread side reads it back as its type, snapshot.extension&lt;T&gt;(index()).</text>
  <line x1="176" y1="434" x2="176" y2="376" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>
