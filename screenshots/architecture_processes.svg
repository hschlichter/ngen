<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1f2733; }
    .h { font-size: 15px; font-weight: 700; fill: #1f2733; }
    .t { font-size: 12.5px; fill: #3a4452; }
    .s { font-size: 11.5px; fill: #5a6575; }
    .mono { font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .edge { font-size: 11.5px; fill: #334155; font-weight: 600; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="28" y="40" class="title">ngen: the processes</text>
  <text x="28" y="62" class="s">Each process is one program; they talk JSON-RPC 2.0 over loopback TCP, binary attachments for packs.</text>

  <!-- Sources -->
  <rect x="28" y="96" width="170" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="122" class="h">Source files</text>
  <text x="44" y="146" class="t">USD layers and payloads</text>
  <text x="44" y="166" class="t">textures (PNG, JPG, EXR)</text>
  <text x="44" y="186" class="t">GLSL shaders</text>
  <text x="44" y="212" class="s">authored, never changed</text>
  <text x="44" y="228" class="s">by the engine</text>

  <!-- Asset server -->
  <rect x="246" y="96" width="250" height="227" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="264" y="122" class="h mono">ngen-asset-server</text>
  <text x="264" y="146" class="t">packs on request, by asset id,</text>
  <text x="264" y="164" class="t">into a cache by content hash</text>
  <rect x="264" y="178" width="214" height="95" rx="6" fill="#ffedd5"/>
  <text x="276" y="198" class="s mono">ngen-packer-usd</text>
  <text x="276" y="215" class="s mono">ngen-packer-texture</text>
  <text x="276" y="232" class="s mono">ngen-packer-shader</text>
  <text x="276" y="249" class="s mono">ngen-packer-exr</text>
  <text x="276" y="266" class="s mono">ngen-packer-copy</text>
  <text x="264" y="297" class="t">notices source edits and</text>
  <text x="264" y="314" class="t">tells the clients</text>

  <line x1="198" y1="170" x2="242" y2="170" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="203" y="160" class="edge">read</text>

  <!-- View -->
  <rect x="580" y="96" width="392" height="300" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="598" y="122" class="h mono">ngen-view</text>
  <text x="690" y="122" class="s">no OpenUSD: composes the packs</text>

  <rect x="598" y="136" width="356" height="56" rx="7" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="612" y="157" class="t" font-weight="700">Main thread</text>
  <text x="612" y="177" class="s">ViewFrame's steps: commands, camera, culling, tools, UI</text>

  <rect x="598" y="200" width="356" height="56" rx="7" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="612" y="221" class="t" font-weight="700">Scene thread</text>
  <text x="612" y="241" class="s">WorldComposer and placement: LOD and streaming</text>

  <rect x="598" y="264" width="356" height="56" rx="7" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="612" y="285" class="t" font-weight="700">Render thread</text>
  <text x="612" y="305" class="s">one snapshot a frame: frame graph, record, submit, present</text>

  <rect x="598" y="328" width="356" height="52" rx="7" fill="#dbeafe"/>
  <text x="612" y="350" class="t" font-weight="700">GPU</text>
  <text x="612" y="369" class="s">culling, indirect draws, deferred shading (Vulkan 1.3)</text>

  <!-- asset server <-> view -->
  <line x1="496" y1="180" x2="576" y2="180" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="502" y="172" class="edge">packs</text>
  <line x1="576" y1="226" x2="500" y2="226" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="502" y="246" class="edge">requests</text>
  <text x="502" y="262" class="s">by asset id</text>

  <!-- Introspect -->
  <rect x="246" y="424" width="250" height="104" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="264" y="450" class="h mono">ngen-introspect</text>
  <text x="264" y="474" class="t">every running process's records</text>
  <text x="264" y="492" class="t">and trace; calls their methods</text>
  <text x="264" y="512" class="s">a window, or the command line</text>

  <rect x="28" y="424" width="170" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="450" class="h">Agents, scripts</text>
  <text x="44" y="474" class="t">read records, call</text>
  <text x="44" y="492" class="t">methods, run verbs</text>
  <text x="44" y="512" class="s mono">ngen-view --script</text>

  <line x1="198" y1="476" x2="242" y2="476" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <path d="M496,456 C600,456 640,440 660,400" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrowGrey)"/>
  <path d="M370,424 L370,327" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrowGrey)"/>
  <text x="512" y="490" class="edge">records · trace · methods</text>
  <text x="512" y="507" class="s">JSON-RPC, loopback TCP</text>

  <!-- cli -->
  <rect x="740" y="424" width="232" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="756" y="450" class="h mono">ngen-cli</text>
  <text x="836" y="450" class="s">the front door</text>
  <text x="756" y="474" class="t">builds (ngen-build), runs the</text>
  <text x="756" y="492" class="t">view and the asset server,</text>
  <text x="756" y="510" class="t">packs ahead, introspects</text>
</svg>
