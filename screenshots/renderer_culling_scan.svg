  <text x="72" y="205" class="h">InstanceCull</text>
  <text x="44" y="230" class="s">frustum test in every view,</text>
  <text x="44" y="246" class="s">bucket from flags; counts per</text>
  <text x="44" y="262" class="s">region in shared memory</text>
  <text x="44" y="298" class="m" font-weight="700">cullGroupCounters</text>
