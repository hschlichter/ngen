<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1f2733; }
    .h { font-size: 14px; font-weight: 700; fill: #1f2733; }
    .lib { font-size: 13.5px; font-weight: 700; fill: #1f2733; font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .f { font-size: 12px; font-weight: 700; fill: #1f2733; font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .t { font-size: 12.5px; fill: #3a4452; }
    .b { font-weight: 700; fill: #1f2733; }
    .s { font-size: 11px; fill: #5a6575; }
    .mono { font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .edge { font-size: 11.5px; font-weight: 600; fill: #334155; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="690" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="28" y="40" class="title">The scene pack format</text>
  <text x="28" y="62" class="s" style="font-size:12px">pack/scenepack.h: a layer, mesh or material pack as ngen-packer-usd writes it; little-endian, every count and offset 64-bit.</text>

  <!-- header -->
  <text x="40" y="100" class="h">Header, 32 bytes</text>
  <text x="40" y="124" class="s mono">0</text>
  <rect x="40" y="130" width="115" height="56" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="97.5" y="154" class="f" text-anchor="middle">magic</text>
  <text x="97.5" y="172" class="s" text-anchor="middle">"NGPK"</text>
  <text x="155" y="124" class="s mono">4</text>
  <rect x="155" y="130" width="115" height="56" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="212.5" y="154" class="f" text-anchor="middle">kind</text>
  <text x="212.5" y="172" class="s" text-anchor="middle">u32</text>
  <text x="270" y="124" class="s mono">8</text>
  <rect x="270" y="130" width="115" height="56" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="327.5" y="154" class="f" text-anchor="middle">version</text>
  <text x="327.5" y="172" class="s" text-anchor="middle">u32</text>
  <text x="385" y="124" class="s mono">12</text>
  <rect x="385" y="130" width="115" height="56" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="442.5" y="154" class="f" text-anchor="middle">section count</text>
  <text x="442.5" y="172" class="s" text-anchor="middle">u32</text>
  <text x="500" y="124" class="s mono">16</text>
  <rect x="500" y="130" width="230" height="56" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="615" y="154" class="f" text-anchor="middle">string table offset</text>
  <text x="615" y="172" class="s" text-anchor="middle">u64</text>
  <text x="730" y="124" class="s mono">24</text>
  <rect x="730" y="130" width="230" height="56" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="845" y="154" class="f" text-anchor="middle">section table offset</text>
  <text x="845" y="172" class="s" text-anchor="middle">u64</text>
  <text x="960" y="124" class="s mono" text-anchor="end">32</text>

  <!-- the file -->
  <path d="M615,186 C615,236 146,226 146,274" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M845,186 C845,236 406,226 406,274" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="40" y="262" class="h">The file</text>
  <rect x="40" y="276" width="100" height="48" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="90" y="297" class="f" text-anchor="middle">header</text>
  <text x="90" y="313" class="s" text-anchor="middle">32 bytes</text>
  <rect x="140" y="276" width="260" height="48" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="270" y="297" class="f" text-anchor="middle">string table</text>
  <text x="270" y="313" class="s" text-anchor="middle">at its offset (32)</text>
  <rect x="400" y="276" width="200" height="48" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="500" y="297" class="f" text-anchor="middle">section table</text>
  <text x="500" y="313" class="s" text-anchor="middle">at its offset</text>
  <rect x="600" y="276" width="120" height="48" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="660" y="304" class="f" text-anchor="middle">section</text>
  <rect x="720" y="276" width="120" height="48" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="780" y="304" class="f" text-anchor="middle">section</text>
  <rect x="840" y="276" width="120" height="48" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="900" y="297" class="t" text-anchor="middle">…</text>
  <text x="900" y="313" class="s" text-anchor="middle">in the order written</text>

  <!-- zoom: string table -->
  <line x1="140" y1="324" x2="40" y2="396" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="400" y1="324" x2="470" y2="396" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="40" y="396" width="80" height="48" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="80" y="416" class="f" text-anchor="middle">count</text>
  <text x="80" y="433" class="s" text-anchor="middle">u64</text>
  <rect x="120" y="396" width="80" height="48" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="160" y="416" class="f" text-anchor="middle">length</text>
  <text x="160" y="433" class="s" text-anchor="middle">u64</text>
  <rect x="200" y="396" width="70" height="48" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="235" y="416" class="f" text-anchor="middle">string 0</text>
  <text x="235" y="433" class="s" text-anchor="middle">its bytes</text>
  <rect x="270" y="396" width="80" height="48" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="310" y="416" class="f" text-anchor="middle">length</text>
  <text x="310" y="433" class="s" text-anchor="middle">u64</text>
  <rect x="350" y="396" width="70" height="48" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="385" y="416" class="f" text-anchor="middle">string 1</text>
  <text x="385" y="433" class="s" text-anchor="middle">its bytes</text>
  <rect x="420" y="396" width="50" height="48" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="445" y="425" class="t" text-anchor="middle">…</text>
  <text x="40" y="466" class="t b">String table</text>
  <text x="40" y="483" class="s">sections name a string by its u32 index</text>

  <!-- zoom: section table -->
  <line x1="400" y1="324" x2="510" y2="396" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="600" y1="324" x2="960" y2="396" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="510" y="396" width="75" height="48" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="547.5" y="416" class="f" text-anchor="middle">id</text>
  <text x="547.5" y="433" class="s" text-anchor="middle">u32</text>
  <rect x="585" y="396" width="75" height="48" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="622.5" y="416" class="f" text-anchor="middle">zero</text>
  <text x="622.5" y="433" class="s" text-anchor="middle">u32</text>
  <rect x="660" y="396" width="150" height="48" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="735" y="416" class="f" text-anchor="middle">offset</text>
  <text x="735" y="433" class="s" text-anchor="middle">u64</text>
  <rect x="810" y="396" width="150" height="48" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="885" y="416" class="f" text-anchor="middle">size</text>
  <text x="885" y="433" class="s" text-anchor="middle">u64</text>
  <text x="510" y="466" class="t b">Section table: one 24-byte entry per section</text>
  <text x="510" y="483" class="s">the id says what the section holds; offset and size, where its bytes are</text>

  <!-- section ids by kind -->
  <text x="40" y="528" class="h">Section ids, by kind</text>
  <rect x="40" y="540" width="290" height="98" rx="8" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="56" y="560" class="t b">Layer pack, kind 1</text>
  <text x="74" y="580" class="s mono" text-anchor="end">1</text>
  <text x="84" y="580" class="s mono">LayerMetadata</text>
  <text x="74" y="596" class="s mono" text-anchor="end">2</text>
  <text x="84" y="596" class="s mono">LayerSublayers</text>
  <text x="74" y="612" class="s mono" text-anchor="end">3</text>
  <text x="84" y="612" class="s mono">LayerPrims</text>
  <text x="74" y="628" class="s mono" text-anchor="end">4</text>
  <text x="84" y="628" class="s mono">LayerWarnings</text>
  <rect x="345" y="540" width="310" height="98" rx="8" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="361" y="560" class="t b">Mesh pack, kind 2</text>
  <text x="379" y="580" class="s mono" text-anchor="end">11</text>
  <text x="389" y="580" class="s mono">MeshInfo</text>
  <text x="379" y="596" class="s mono" text-anchor="end">12</text>
  <text x="389" y="596" class="s mono">MeshVertices, 44 bytes each</text>
  <text x="379" y="612" class="s mono" text-anchor="end">13</text>
  <text x="389" y="612" class="s mono">MeshIndices, u32</text>
  <text x="379" y="628" class="s mono" text-anchor="end">14</text>
  <text x="389" y="628" class="s mono">MeshSubmeshes</text>
  <rect x="670" y="540" width="290" height="98" rx="8" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="686" y="560" class="t b">Material pack, kind 3</text>
  <text x="704" y="580" class="s mono" text-anchor="end">21</text>
  <text x="714" y="580" class="s mono">MaterialInfo</text>
  <text x="40" y="662" class="s">A section is a sequence of fields in the order the writer puts them (scenepack.cpp). Readers check every offset and index and return an error</text>
  <text x="40" y="678" class="s">rather than read past the bytes. A format change bumps scenePackFormatVersion, now 4, and the usd rule's version.</text>
</svg>
