<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1f2733; }
    .h { font-size: 15px; font-weight: 700; fill: #1f2733; }
    .lib { font-size: 13.5px; font-weight: 700; fill: #1f2733; font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .m { font-size: 11px; fill: #334155; font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .s { font-size: 11px; fill: #5a6575; }
    .t { font-size: 12.5px; fill: #3a4452; }
    .edge { font-size: 11.5px; fill: #334155; font-weight: 600; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="540" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="28" y="40" class="title">Assets: source files to engine-ready bytes</text>
  <text x="28" y="62" class="s" style="font-size:12px">A client asks for an asset by id; the server packs it if its cache is out of date and streams the packed bytes. No client reads the files.</text>

  <!-- Sources -->
  <rect x="28" y="92" width="184" height="354" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-opacity="0.45"/>
  <text x="40" y="116" class="h">Source files</text>
  <text x="40" y="134" class="s">in the server's working directory</text>

  <rect x="40" y="150" width="160" height="44" rx="7" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="52" y="168" class="m">.vert .frag .comp</text>
  <text x="52" y="184" class="s">GLSL shaders</text>

  <rect x="40" y="202" width="160" height="44" rx="7" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="52" y="220" class="m">.png .jpg .jpeg</text>
  <text x="52" y="236" class="s">textures</text>

  <rect x="40" y="254" width="160" height="44" rx="7" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="52" y="272" class="m">.exr</text>
  <text x="52" y="288" class="s">a dome light's sky</text>

  <rect x="40" y="306" width="160" height="44" rx="7" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="52" y="324" class="m">.usda .usdc .usd</text>
  <text x="52" y="340" class="s">scenes, one file at a time</text>

  <rect x="40" y="358" width="160" height="44" rx="7" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="52" y="376" class="m">.hdr</text>
  <text x="52" y="392" class="s">read in its source format</text>

  <text x="40" y="426" class="s">authored, never changed</text>

  <!-- source -> packer, one per rule -->
  <line x1="200" y1="172" x2="248" y2="172" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="200" y1="224" x2="248" y2="224" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="200" y1="276" x2="248" y2="276" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="200" y1="328" x2="248" y2="328" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="200" y1="380" x2="248" y2="380" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Asset server -->
  <rect x="240" y="92" width="400" height="354" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-opacity="0.45"/>
  <text x="252" y="116" class="lib">ngen-asset-server</text>
  <text x="402" y="116" class="s">one per variant</text>
  <text x="252" y="134" class="s"><tspan class="m">pack.cpp</tspan>'s rules: one packer program per extension</text>

  <rect x="252" y="150" width="192" height="44" rx="7" fill="#ffffff" stroke="#db2777" stroke-opacity="0.6"/>
  <text x="264" y="168" class="m">ngen-packer-shader</text>
  <text x="264" y="184" class="s">SPIR-V</text>

  <rect x="252" y="202" width="192" height="44" rx="7" fill="#ffffff" stroke="#db2777" stroke-opacity="0.6"/>
  <text x="264" y="220" class="m">ngen-packer-texture</text>
  <text x="264" y="236" class="s">RGBA8 sRGB, every mip level</text>

  <rect x="252" y="254" width="192" height="44" rx="7" fill="#ffffff" stroke="#db2777" stroke-opacity="0.6"/>
  <text x="264" y="272" class="m">ngen-packer-exr</text>
  <text x="264" y="288" class="s">Rgb9e5 and its irradiance</text>

  <rect x="252" y="306" width="192" height="44" rx="7" fill="#ffffff" stroke="#db2777" stroke-opacity="0.6"/>
  <text x="264" y="324" class="m">ngen-packer-usd</text>
  <text x="264" y="340" class="s">layer, mesh, material packs</text>

  <rect x="252" y="358" width="192" height="44" rx="7" fill="#ffffff" stroke="#db2777" stroke-opacity="0.6"/>
  <text x="264" y="376" class="m">ngen-packer-copy</text>
  <text x="264" y="392" class="s">the source's bytes</text>

  <text x="252" y="426" class="s">run only on a request, when the cache is out of date</text>

  <line x1="444" y1="172" x2="466" y2="172" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="444" y1="224" x2="466" y2="224" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="444" y1="276" x2="466" y2="276" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="444" y1="328" x2="466" y2="328" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="444" y1="380" x2="466" y2="380" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="470" y="150" width="158" height="252" rx="7" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="482" y="172" class="t" font-weight="700">The cache</text>
  <text x="482" y="192" class="m">.ngen-assets/</text>
  <text x="482" y="208" class="m">&lt;platform&gt;/&lt;config&gt;/</text>
  <text x="482" y="234" class="s">packed files at their</text>
  <text x="482" y="249" class="s">asset id; each records the</text>
  <text x="482" y="264" class="s">inputs it was packed from</text>
  <text x="482" y="290" class="s">up to date: streamed</text>
  <text x="482" y="305" class="s">as it is, no packer runs</text>
  <text x="482" y="331" class="s">a source edited: the</text>
  <text x="482" y="346" class="s">clients holding it are told</text>

  <!-- server <-> clients -->
  <text x="710" y="150" class="s" text-anchor="middle">JSON-RPC, loopback TCP</text>
  <line x1="776" y1="196" x2="644" y2="196" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="710" y="186" class="edge" text-anchor="middle">asset.request</text>
  <text x="710" y="214" class="s" text-anchor="middle">ids, and versions held</text>

  <line x1="644" y1="262" x2="776" y2="262" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="710" y="252" class="edge" text-anchor="middle">packed bytes</text>
  <text x="710" y="280" class="s" text-anchor="middle">asset.data chunks,</text>
  <text x="710" y="295" class="s" text-anchor="middle">then asset.ready</text>

  <line x1="644" y1="352" x2="776" y2="352" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="710" y="342" class="edge" text-anchor="middle">asset.changed</text>
  <text x="710" y="370" class="s" text-anchor="middle">a source changed</text>

  <!-- Clients -->
  <rect x="780" y="92" width="192" height="354" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.45"/>
  <text x="792" y="116" class="h">Clients</text>
  <text x="792" y="134" class="s">each through an <tspan class="m">AssetClient</tspan></text>

  <rect x="792" y="150" width="168" height="52" rx="7" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.6"/>
  <text x="804" y="172" class="lib">ngen-view</text>
  <text x="804" y="190" class="s">the scene, textures, shaders</text>

  <rect x="792" y="210" width="168" height="52" rx="7" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.6"/>
  <text x="804" y="232" class="lib">ngen-pack</text>
  <text x="804" y="250" class="s">fills the cache ahead</text>

  <rect x="792" y="270" width="168" height="52" rx="7" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.6"/>
  <text x="804" y="292" class="lib">ngen-packdump</text>
  <text x="804" y="310" class="s">prints scene packs</text>

  <rect x="792" y="330" width="168" height="52" rx="7" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.6"/>
  <text x="804" y="352" class="lib">ngen-worldcheck</text>
  <text x="804" y="370" class="s">composes a World</text>

  <!-- Ids and versions -->
  <rect x="28" y="466" width="944" height="50" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-opacity="0.45"/>
  <text x="44" y="486" class="t" font-weight="700">Asset id: a path</text>
  <text x="44" y="504" class="s">relative to the working directory: <tspan class="m">shaders/gbuffer.vert</tspan>, <tspan class="m">assets/layered/base.usda#/World/Group/Own</tspan></text>
  <text x="640" y="486" class="t" font-weight="700">Version: a content hash</text>
  <text x="640" y="504" class="s">of the packed file, FNV-1a 64, sent as 16 hex digits</text>
</svg>
