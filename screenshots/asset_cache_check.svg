<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1f2733; }
    .h { font-size: 14px; font-weight: 700; fill: #1f2733; }
    .lib { font-size: 13.5px; font-weight: 700; fill: #1f2733; font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .f { font-size: 12px; font-weight: 700; fill: #1f2733; font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .t { font-size: 12.5px; fill: #3a4452; }
    .b { font-weight: 700; fill: #1f2733; }
    .s { font-size: 11px; fill: #5a6575; }
    .mono { font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .edge { font-size: 11.5px; font-weight: 600; fill: #334155; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="600" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="28" y="40" class="title">The cache: up to date or repack</text>
  <text x="28" y="62" class="s" style="font-size:12px">AssetCache::upToDate(id, jobKey), per requested asset: whether the cached file streams or the rule's packer runs again.</text>

  <!-- the record -->
  <rect x="60" y="92" width="380" height="56" rx="8" fill="#ffffff" stroke="#db2777" stroke-opacity="0.6"/>
  <text x="76" y="115" class="t b">the asset's record in .ngen-assetcache</text>
  <text x="76" y="134" class="s">its own, or its job's for a &lt;file&gt;#&lt;fragment&gt; id</text>
  <line x1="250" y1="148" x2="250" y2="176" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- job key -->
  <rect x="60" y="178" width="380" height="58" rx="8" fill="#ffffff" stroke="#db2777" stroke-opacity="0.6"/>
  <text x="76" y="202" class="t b">job key as recorded?</text>
  <text x="76" y="221" class="s">a hash of the rule's name, version, parameters and packer</text>
  <line x1="440" y1="207" x2="698" y2="207" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="452" y="199" class="s">no, or no record</text>
  <line x1="250" y1="236" x2="250" y2="266" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="258" y="256" class="s">yes</text>

  <!-- each recorded file -->
  <rect x="40" y="268" width="600" height="210" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-opacity="0.45"/>
  <text x="56" y="290" class="t b">each recorded file</text>
  <text x="56" y="307" class="s">the packer binary, the packed file, the source, and every file in the depfile</text>
  <rect x="60" y="324" width="250" height="58" rx="8" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="76" y="348" class="t b">size and mtime as recorded?</text>
  <text x="76" y="367" class="s">a stat call</text>
  <rect x="370" y="324" width="250" height="58" rx="8" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="386" y="348" class="t b">content hash as recorded?</text>
  <text x="386" y="367" class="s">FNV-1a 64 of the file's bytes</text>
  <line x1="310" y1="353" x2="368" y2="353" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="324" y="346" class="s">no</text>
  <rect x="60" y="420" width="560" height="42" rx="8" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="76" y="446" class="t b">unchanged</text>
  <text x="160" y="446" class="s">a file whose size and mtime match is not hashed again</text>
  <line x1="185" y1="382" x2="185" y2="418" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="193" y="404" class="s">yes</text>
  <line x1="495" y1="382" x2="495" y2="418" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="503" y="404" class="s">yes</text>
  <line x1="620" y1="353" x2="698" y2="353" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="648" y="345" class="s">no, or gone</text>

  <!-- up to date -->
  <line x1="250" y1="478" x2="250" y2="510" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="258" y="498" class="s">every file unchanged</text>
  <rect x="60" y="512" width="380" height="58" rx="8" fill="#ffffff" stroke="#db2777" stroke-opacity="0.6"/>
  <text x="76" y="536" class="t b">up to date</text>
  <text x="76" y="555" class="s">version = the packed file's hash; the cached file streams</text>

  <!-- repack -->
  <rect x="700" y="178" width="260" height="204" rx="8" fill="#ffffff" stroke="#db2777" stroke-opacity="0.6"/>
  <text x="716" y="202" class="t b">repack</text>
  <text x="716" y="226" class="s">the rule's packer runs; record() stores</text>
  <text x="716" y="242" class="s">the job key and each file's size, mtime</text>
  <text x="716" y="258" class="s">and hash: the packer binary, the source</text>
  <text x="716" y="274" class="s">and the depfile's files, the packed file</text>
  <text x="716" y="298" class="s">version = the new packed file's hash;</text>
  <text x="716" y="314" class="s">asset.ready says packed: true</text>
  <text x="716" y="338" class="s">force: true repacks without the check,</text>
  <text x="716" y="354" class="s">each file's job once per request</text>
</svg>
