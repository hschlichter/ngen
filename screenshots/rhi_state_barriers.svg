<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1f2733; }
    .h { font-size: 15px; font-weight: 700; fill: #1f2733; }
    .sec { font-size: 13px; font-weight: 700; fill: #1f2733; }
    .lib { font-size: 13.5px; font-weight: 700; fill: #1f2733; font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .t { font-size: 12.5px; fill: #3a4452; }
    .s { font-size: 11px; fill: #5a6575; }
    .m { font-size: 11px; fill: #3a4452; font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .v { font-size: 12px; fill: #1f2733; font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .edge { font-size: 11.5px; fill: #334155; font-weight: 600; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="690" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="28" y="40" class="title">RHI: states in, Vulkan barriers out</text>
  <text x="28" y="62" class="s" style="font-size:12px">The caller names an old and a new state; the Vulkan backend derives layout, stages and accesses and records one vkCmdPipelineBarrier2.</text>

  <!-- Caller -->
  <rect x="28" y="88" width="290" height="184" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-opacity="0.45"/>
  <text x="44" y="112" class="h">Caller</text>
  <text x="44" y="130" class="s">tracks each resource's current state</text>
  <rect x="44" y="142" width="258" height="94" rx="8" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.6"/>
  <text x="58" y="164" class="lib">FrameGraph</text>
  <text x="58" y="184" class="s">keeps resourceAccess[res] per resource;</text>
  <text x="58" y="200" class="s">per pass, accessToLayout() and</text>
  <text x="58" y="216" class="s">accessToBufferState() give old and new</text>
  <text x="44" y="256" class="s">also by hand: GpuUploader, GpuScene, capture</text>

  <line x1="318" y1="189" x2="344" y2="189" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- RHI interface -->
  <rect x="348" y="88" width="300" height="184" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-opacity="0.45"/>
  <text x="364" y="112" class="h">RHI interface</text>
  <text x="364" y="130" class="s">src/rhi: names the states, keeps none</text>
  <rect x="364" y="142" width="268" height="114" rx="8" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="378" y="164" class="lib">pipelineBarrier</text>
  <text x="378" y="182" class="m">(textureBarriers, bufferBarriers)</text>
  <text x="378" y="206" class="m">RhiTextureBarrierDesc</text>
  <text x="378" y="222" class="m">RhiBufferBarrierDesc</text>
  <text x="378" y="242" class="s">each: resource, oldState, newState</text>

  <line x1="648" y1="189" x2="674" y2="189" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Vulkan backend -->
  <rect x="678" y="88" width="294" height="184" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-opacity="0.45"/>
  <text x="694" y="112" class="h">Vulkan backend</text>
  <text x="694" y="130" class="s">src/rhi/vulkan: derives the masks</text>
  <rect x="694" y="142" width="262" height="72" rx="8" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="708" y="164" class="lib">RhiCommandBufferVulkan</text>
  <text x="708" y="184" class="s">per texture: VkImageMemoryBarrier2</text>
  <text x="708" y="200" class="s">per buffer: VkBufferMemoryBarrier2</text>
  <rect x="694" y="222" width="262" height="36" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-opacity="0.6"/>
  <text x="708" y="245" class="v" font-weight="700">vkCmdPipelineBarrier2</text>
  <text x="878" y="245" class="s">one call</text>

  <!-- States -->
  <text x="28" y="304" class="sec">States name what the resource is used for next</text>
  <rect x="28" y="316" width="462" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="44" y="338" class="lib">RhiTextureState</text>
  <text x="44" y="358" class="s">Undefined · ColorAttachment · DepthStencilAttachment · ShaderReadOnly</text>
  <text x="44" y="374" class="s">General · TransferSrc · TransferDst · PresentSrc</text>
  <rect x="510" y="316" width="462" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="526" y="338" class="lib">RhiBufferState</text>
  <text x="526" y="358" class="s">Undefined · VertexRead · IndexRead · UniformRead · StorageRead</text>
  <text x="526" y="374" class="s">StorageWrite · TransferSrc · TransferDst · IndirectRead</text>

  <!-- Worked example -->
  <text x="28" y="418" class="sec">Worked example: a pass wrote a texture, the next pass samples it</text>
  <rect x="28" y="430" width="944" height="184" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="28.5" y="430.5" width="943" height="34" rx="8" fill="#f1f5f9"/>
  <text x="44" y="452" class="s" font-weight="700">derived by</text>
  <text x="270" y="452" class="s" font-weight="700">old state</text>
  <text x="326" y="452" class="v" font-weight="700">ColorAttachment</text>
  <text x="600" y="452" class="s" font-weight="700">new state</text>
  <text x="658" y="452" class="v" font-weight="700">ShaderReadOnly</text>

  <text x="44" y="484" class="t" font-weight="700">layout</text>
  <text x="44" y="500" class="m">toVkImageLayout</text>
  <text x="270" y="493" class="v">COLOR_ATTACHMENT_OPTIMAL</text>
  <line x1="540" y1="489" x2="586" y2="489" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="600" y="493" class="v">SHADER_READ_ONLY_OPTIMAL</text>
  <line x1="44" y1="514" x2="956" y2="514" stroke="#e2e8f0"/>

  <text x="44" y="534" class="t" font-weight="700">stage mask</text>
  <text x="44" y="550" class="m">stateToStageMask</text>
  <text x="270" y="543" class="v">COLOR_ATTACHMENT_OUTPUT</text>
  <line x1="540" y1="539" x2="586" y2="539" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="600" y="543" class="v">VERTEX_SHADER | FRAGMENT_SHADER | COMPUTE_SHADER</text>
  <line x1="44" y1="564" x2="956" y2="564" stroke="#e2e8f0"/>

  <text x="44" y="584" class="t" font-weight="700">access mask</text>
  <text x="44" y="600" class="m">stateToAccessMask</text>
  <text x="270" y="593" class="v">COLOR_ATTACHMENT_WRITE</text>
  <line x1="540" y1="589" x2="586" y2="589" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="600" y="593" class="v">SHADER_READ</text>

  <text x="28" y="638" class="s">Prefixes left out: VK_IMAGE_LAYOUT_, VK_PIPELINE_STAGE_2_ and VK_ACCESS_2_ (bits end in _BIT). Every mip level and array layer; queue families ignored.</text>
  <text x="28" y="656" class="s">A shader state covers vertex, fragment and compute stages: conservative but correct. Buffers use the same stage and access maps, without a layout.</text>
  <text x="28" y="674" class="s">describeTransition(old, new) returns these layouts and masks as text, from the same functions.</text>
</svg>
