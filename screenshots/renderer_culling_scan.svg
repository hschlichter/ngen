  <text x="42" y="624" class="s">Camera regions draw each instance's submesh range; cascade regions draw primFirst instances' whole mesh (a prim with a cutout</text>
  <text x="42" y="640" class="s">submesh draws per submesh). Every cascade is sized from the same bucket counts; a region with no instances is empty.</text>
  <rect x="42" y="652" width="10" height="14" rx="2" fill="#86efac"/>
  <text x="58" y="664" class="s">a command written this frame</text>
  <rect x="226" y="652" width="12" height="14" fill="#ffffff" stroke="#16a34a" stroke-opacity="0.8"/>
  <text x="244" y="664" class="s">room for an instance the CPU counted, culled this frame</text>

  <!-- The draws -->
  <rect x="28" y="700" width="944" height="66" rx="10" fill="#ffffff" stroke="#16a34a" stroke-opacity="0.6"/>
  <text x="42" y="722" class="m" font-weight="700">drawIndexedIndirectCount(drawCommands, commandOffset(r), drawCounts, countOffset(r), regionCapacity(r))</text>
  <text x="42" y="742" class="s">one call per region: the camera's four in DepthPrepass, GeometryPass and DebugViewPass; each cascade's four in ShadowPass.</text>
  <text x="42" y="758" class="s">Pipeline, sets and pool are bound once per bucket. An empty region still costs a call: only the GPU knows the count.</text>
</svg>
