<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1f2733; }
    .h { font-size: 14px; font-weight: 700; fill: #1f2733; }
    .lib { font-size: 13.5px; font-weight: 700; fill: #1f2733; font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .t { font-size: 12.5px; fill: #3a4452; }
    .s { font-size: 11px; fill: #5a6575; }
    .m { font-size: 11px; fill: #334155; font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .mono { font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .edge { font-size: 11.5px; fill: #334155; font-weight: 600; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#86efac"/>
      <rect width="3" height="6" fill="#22c55e"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1000" height="470" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="28" y="40" class="title">Render LOD: the pick and the fade</text>
  <text x="28" y="62" class="s" style="font-size:12px">One group with distance thresholds 10 m and 30 m and a blend band on the first boundary (to 15 m), with the default hysteresis.</text>

  <!-- the pick -->
  <rect x="28" y="88" width="618" height="356" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-opacity="0.45"/>
  <text x="44" y="112" class="lib">LodSelect</text>
  <text x="132" y="112" class="s">lodselect.comp, one thread per group; pickLodLevel (src/world/world.cpp) is the same rule on the CPU</text>
  <line x1="211" y1="140" x2="211" y2="316" stroke="#64748b" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="278.5" y1="140" x2="278.5" y2="316" stroke="#64748b" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="481" y1="140" x2="481" y2="316" stroke="#64748b" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="207" y="136" class="s" text-anchor="end">threshold 0</text>
  <text x="282.5" y="136" class="s">blend threshold 0</text>
  <text x="485" y="136" class="s">threshold 1</text>
  <text x="44" y="162" class="s">drawn</text>
  <rect x="76" y="146" width="202.5" height="26" fill="#dcfce7"/>
  <text x="177" y="163" class="t" text-anchor="middle">level 0</text>
  <rect x="278.5" y="146" width="202.5" height="26" fill="#86efac"/>
  <text x="380" y="163" class="t" text-anchor="middle">level 1</text>
  <rect x="528" y="146" width="88" height="26" fill="#22c55e"/>
  <text x="572" y="163" class="t" text-anchor="middle">level 2</text>
  <rect x="481" y="146" width="47" height="26" fill="url(#hatch)"/>
  <text x="44" y="206" class="s">fading in</text>
  <polygon points="211,216 278.5,216 278.5,188" fill="#86efac"/>
  <line x1="211" y1="216" x2="278.5" y2="216" stroke="#16a34a" stroke-opacity="0.6"/>
  <text x="286.5" y="200" class="t">level 1 fades in (if resident)</text>
  <text x="286.5" y="216" class="t">share = (d &#8722; 10) / 5</text>
  <text x="44" y="246" class="s">coarser</text>
  <line x1="346" y1="242" x2="528" y2="242" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="536" y="246" class="t">1 &#8594; 2 at 33.5 m</text>
  <text x="44" y="270" class="s">finer</text>
  <line x1="616" y1="266" x2="481" y2="266" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="473" y="270" class="t" text-anchor="end">2 &#8594; 1 at 30 m</text>
  <line x1="76" y1="302" x2="622" y2="302" stroke="#475569" stroke-width="1.4"/>
  <line x1="76" y1="302" x2="76" y2="308" stroke="#475569" stroke-width="1.4"/>
  <text x="76" y="322" class="s" text-anchor="middle">0</text>
  <line x1="211" y1="302" x2="211" y2="308" stroke="#475569" stroke-width="1.4"/>
  <text x="211" y="322" class="s" text-anchor="middle">10</text>
  <line x1="278.5" y1="302" x2="278.5" y2="308" stroke="#475569" stroke-width="1.4"/>
  <text x="278.5" y="322" class="s" text-anchor="middle">15</text>
  <line x1="346" y1="302" x2="346" y2="308" stroke="#475569" stroke-width="1.4"/>
  <text x="346" y="322" class="s" text-anchor="middle">20</text>
  <line x1="481" y1="302" x2="481" y2="308" stroke="#475569" stroke-width="1.4"/>
  <text x="481" y="322" class="s" text-anchor="middle">30</text>
  <line x1="528" y1="302" x2="528" y2="308" stroke="#475569" stroke-width="1.4"/>
  <text x="528" y="322" class="s" text-anchor="middle">33.5</text>
  <line x1="616" y1="302" x2="616" y2="308" stroke="#475569" stroke-width="1.4"/>
  <text x="616" y="322" class="s" text-anchor="middle">40</text>
  <text x="620" y="296" class="s" text-anchor="end">m</text>
  <circle cx="236.5" cy="205.5" r="3.5" fill="#1f2733"/>
  <text x="44" y="346" class="t">Measured from the live main camera (RenderSnapshot::lodEye) to the group&#8217;s center or box.</text>
  <text x="44" y="366" class="t">With a band, both directions switch at its edge (15 m) and the fade is the transition.</text>
  <text x="44" y="386" class="t">Without one, coarser waits for the margin: the hatched stretch keeps last frame&#8217;s level.</text>
  <text x="44" y="410" class="s">Hysteresis 20% (RenderSnapshot::lodHysteresis): of a screen size; for a distance, 30 &#215; 1 / &#8730;(1 &#8722; 0.2) = 33.5 m.</text>

  <!-- the fade's dither -->
  <rect x="666" y="88" width="306" height="356" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-opacity="0.45"/>
  <text x="682" y="112" class="lib">lodFadedAway</text>
  <text x="682" y="130" class="s">lodfade.glsl, fragment stage, cutout buckets</text>
  <rect x="739" y="166" width="40" height="40" fill="#86efac" stroke="#ffffff" stroke-width="2"/>
  <text x="759" y="191" class="m" text-anchor="middle">0</text>
  <rect x="779" y="166" width="40" height="40" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/>
  <text x="799" y="191" class="m" text-anchor="middle">8</text>
  <rect x="819" y="166" width="40" height="40" fill="#86efac" stroke="#ffffff" stroke-width="2"/>
  <text x="839" y="191" class="m" text-anchor="middle">2</text>
  <rect x="859" y="166" width="40" height="40" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/>
  <text x="879" y="191" class="m" text-anchor="middle">10</text>
  <rect x="739" y="206" width="40" height="40" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/>
  <text x="759" y="231" class="m" text-anchor="middle">12</text>
  <rect x="779" y="206" width="40" height="40" fill="#86efac" stroke="#ffffff" stroke-width="2"/>
  <text x="799" y="231" class="m" text-anchor="middle">4</text>
  <rect x="819" y="206" width="40" height="40" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/>
  <text x="839" y="231" class="m" text-anchor="middle">14</text>
  <rect x="859" y="206" width="40" height="40" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/>
  <text x="879" y="231" class="m" text-anchor="middle">6</text>
  <rect x="739" y="246" width="40" height="40" fill="#86efac" stroke="#ffffff" stroke-width="2"/>
  <text x="759" y="271" class="m" text-anchor="middle">3</text>
  <rect x="779" y="246" width="40" height="40" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/>
  <text x="799" y="271" class="m" text-anchor="middle">11</text>
  <rect x="819" y="246" width="40" height="40" fill="#86efac" stroke="#ffffff" stroke-width="2"/>
  <text x="839" y="271" class="m" text-anchor="middle">1</text>
  <rect x="859" y="246" width="40" height="40" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/>
  <text x="879" y="271" class="m" text-anchor="middle">9</text>
  <rect x="739" y="286" width="40" height="40" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/>
  <text x="759" y="311" class="m" text-anchor="middle">15</text>
  <rect x="779" y="286" width="40" height="40" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/>
  <text x="799" y="311" class="m" text-anchor="middle">7</text>
  <rect x="819" y="286" width="40" height="40" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/>
  <text x="839" y="311" class="m" text-anchor="middle">13</text>
  <rect x="859" y="286" width="40" height="40" fill="#86efac" stroke="#ffffff" stroke-width="2"/>
  <text x="879" y="311" class="m" text-anchor="middle">5</text>
  <text x="731" y="191" class="s" text-anchor="end">y 0</text>
  <text x="731" y="311" class="s" text-anchor="end">y 3</text>
  <text x="759" y="160" class="s" text-anchor="middle">x 0</text>
  <text x="879" y="160" class="s" text-anchor="middle">x 3</text>
  <rect x="682" y="340" width="12" height="12" fill="#86efac"/>
  <text x="700" y="350" class="t">level 1, fading in: threshold &lt; share</text>
  <rect x="682" y="360" width="12" height="12" fill="#dcfce7" stroke="#86efac"/>
  <text x="700" y="370" class="t">level 0, drawn: the rest</text>
  <text x="682" y="394" class="t">share 0.375 (the dot, 11.9 m): 6 of 16</text>
  <text x="682" y="414" class="s">cell = gl_FragCoord.xy &amp; 3</text>
  <text x="682" y="430" class="s">threshold = (bayer[cell] + 0.5) / 16</text>
</svg>
