<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1104" viewBox="0 0 1000 1104" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1f2733; }
    .h { font-size: 15px; font-weight: 700; fill: #1f2733; }
    .lib { font-size: 12.5px; font-weight: 700; fill: #1f2733; font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .f { font-size: 11.5px; fill: #1f2733; font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .fs { font-size: 10.5px; fill: #5a6575; font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .t { font-size: 12.5px; fill: #3a4452; }
    .s { font-size: 11px; fill: #5a6575; }
    .c { font-size: 10.5px; fill: #3a4452; text-anchor: middle; }
    .mono { font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .edge { font-size: 11px; fill: #334155; font-weight: 600; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1104" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="28" y="40" class="title">Renderer: a mesh from pack time to pixels</text>
  <text x="28" y="62" class="s" style="font-size:12px">Meshes are packed into meshlets once; each frame culls instances, then meshlets, and every mesh pass draws the survivors with mesh shaders.</text>

  <!-- 1 Pack time -->
  <rect x="28" y="88" width="724" height="176" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.45"/>
  <text x="44" y="112" class="h">1  Pack time</text>
  <text x="44" y="130" class="s">ngen-asset-server runs ngen-packer-usd per USD file; a mesh pack's meshlets come from pack/meshletbuild.cpp (meshoptimizer)</text>

  <rect x="42" y="142" width="159" height="62" rx="8" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.6"/>
  <text x="52" y="161" class="t" font-weight="700">Weld</text>
  <text x="52" y="178" class="s">bitwise-identical vertices</text>
  <text x="52" y="193" class="s">become one</text>
  <line x1="201" y1="173" x2="219" y2="173" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="221" y="142" width="159" height="62" rx="8" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.6"/>
  <text x="231" y="161" class="t" font-weight="700">Order</text>
  <text x="231" y="178" class="s">each submesh's triangles,</text>
  <text x="231" y="193" class="s">for the vertex cache</text>
  <line x1="380" y1="173" x2="398" y2="173" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="400" y="142" width="159" height="62" rx="8" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.6"/>
  <text x="410" y="161" class="t" font-weight="700">Split into meshlets</text>
  <text x="410" y="178" class="s">at most 64 vertices</text>
  <text x="410" y="193" class="s">and 124 triangles</text>
  <line x1="559" y1="173" x2="577" y2="173" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="579" y="142" width="159" height="62" rx="8" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.6"/>
  <text x="589" y="161" class="t" font-weight="700">Bounds</text>
  <text x="589" y="178" class="s">a bounding sphere and</text>
  <text x="589" y="193" class="s">a normal cone (8-bit)</text>

  <text x="44" y="232" class="s">a mesh's meshlets</text>
  <rect x="146" y="218" width="22" height="20" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-opacity="0.7"/>
  <rect x="170" y="218" width="22" height="20" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-opacity="0.7"/>
  <rect x="194" y="218" width="22" height="20" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-opacity="0.7"/>
  <rect x="218" y="218" width="22" height="20" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-opacity="0.7"/>
  <rect x="242" y="218" width="22" height="20" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-opacity="0.7"/>
  <rect x="266" y="218" width="22" height="20" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-opacity="0.7"/>
  <rect x="290" y="218" width="22" height="20" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-opacity="0.7"/>
  <rect x="314" y="218" width="22" height="20" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-opacity="0.7"/>
  <path d="M146,244 V249 H264 V244" fill="none" stroke="#2563eb" stroke-opacity="0.7"/>
  <text x="205" y="259" class="fs" text-anchor="middle">submesh 0</text>
  <path d="M266,244 V249 H336 V244" fill="none" stroke="#2563eb" stroke-opacity="0.7"/>
  <text x="301" y="259" class="fs" text-anchor="middle">submesh 1</text>
  <text x="360" y="226" class="s">A submesh is a range of its mesh's meshlets: no meshlet mixes materials.</text>
  <text x="360" y="242" class="s">A meshlet: vertex indices (32-bit, into the mesh) and triangles</text>
  <text x="360" y="256" class="s">(a 32-bit word, three local indices). A repack gives the same bytes.</text>

  <line x1="390" y1="264" x2="390" y2="294" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="402" y="283" class="edge">the view loads the mesh pack; SceneChanges, then the SceneUpload pass</text>

  <!-- 2 GPU scene -->
  <rect x="28" y="296" width="724" height="172" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-opacity="0.45"/>
  <text x="44" y="320" class="h">2  GPU scene</text>
  <text x="44" y="338" class="s">GpuScene's tables and pool, changed piece by piece; a first-fit range per mesh in each pool buffer</text>

  <rect x="42" y="350" width="300" height="106" rx="8" fill="#ffffff" stroke="#16a34a" stroke-opacity="0.6"/>
  <text x="54" y="370" class="t" font-weight="700">Geometry pool</text>
  <text x="54" y="388" class="f">vertices</text>
  <text x="330" y="388" class="fs" text-anchor="end">Vertex</text>
  <text x="54" y="404" class="f">positions</text>
  <text x="330" y="404" class="fs" text-anchor="end">12 B, depth-only</text>
  <text x="54" y="420" class="f">meshlets</text>
  <text x="330" y="420" class="fs" text-anchor="end">GpuMeshlet, 32 B</text>
  <text x="54" y="436" class="f">meshlet vertices</text>
  <text x="330" y="436" class="fs" text-anchor="end">32-bit, mesh-local</text>
  <text x="54" y="452" class="f">meshlet triangles</text>
  <text x="330" y="452" class="fs" text-anchor="end">a word each</text>

  <rect x="356" y="350" width="170" height="106" rx="8" fill="#ffffff" stroke="#16a34a" stroke-opacity="0.6"/>
  <text x="368" y="370" class="lib">GpuMeshEntry</text>
  <text x="514" y="370" class="fs" text-anchor="end">16 B</text>
  <text x="368" y="388" class="s">mesh table, per mesh</text>
  <text x="368" y="404" class="f">vertexOffset</text>
  <text x="368" y="420" class="f">meshletOffset</text>
  <text x="368" y="436" class="f">meshletCount</text>
  <text x="368" y="452" class="f">triangleCount</text>

  <rect x="540" y="350" width="198" height="106" rx="8" fill="#ffffff" stroke="#16a34a" stroke-opacity="0.6"/>
  <text x="552" y="370" class="t" font-weight="700">Per draw slot</text>
  <text x="552" y="388" class="f" font-weight="700">GpuInstanceRecord</text>
  <text x="726" y="388" class="fs" text-anchor="end">128 B</text>
  <text x="552" y="403" class="s">model, material, its meshlets;</text>
  <text x="552" y="416" class="s">read by the task and mesh shaders</text>
  <text x="552" y="436" class="f" font-weight="700">GpuCullRecord</text>
  <text x="726" y="436" class="fs" text-anchor="end">48 B</text>
  <text x="552" y="451" class="s">what culling reads</text>

  <line x1="390" y1="468" x2="390" y2="498" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="402" y="487" class="edge">every slot's culling record, every frame</text>

  <!-- 3 Instance culling -->
  <rect x="28" y="500" width="724" height="244" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-opacity="0.45"/>
  <text x="44" y="524" class="h">3  Instance culling</text>
  <text x="44" y="542" class="s">compute, shaders/instancecull.comp; every draw slot, every view at once</text>

  <rect x="42" y="554" width="218" height="78" rx="8" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.6"/>
  <text x="54" y="573" class="lib">InstanceCull</text>
  <text x="54" y="591" class="s">a box per 256 slots first, then</text>
  <text x="54" y="606" class="s">each box: 6 planes per view;</text>
  <text x="54" y="621" class="s">render LOD; occlusion history</text>
  <line x1="260" y1="593" x2="278" y2="593" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="280" y="554" width="220" height="78" rx="8" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.6"/>
  <text x="292" y="573" class="lib">InstanceCullScan</text>
  <text x="292" y="591" class="s">counts per 256 slots become</text>
  <text x="292" y="606" class="s">offsets and totals; the regions</text>
  <text x="292" y="621" class="s">laid out one after another</text>
  <line x1="500" y1="593" x2="518" y2="593" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="520" y="554" width="218" height="78" rx="8" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.6"/>
  <text x="532" y="573" class="lib">InstanceCullScatter</text>
  <text x="532" y="591" class="s">ordered compaction: each drawn</text>
  <text x="532" y="606" class="s">instance's meshlets as work</text>
  <text x="532" y="621" class="s">items, in instance order</text>

  <text x="44" y="654" class="f">cull.workitems</text>
  <text x="160" y="654" class="s">a region per (view, bucket); buckets: single- or double-sided, opaque or cutout</text>
  <rect x="42" y="662" width="54" height="24" rx="3" fill="#ffedd5" stroke="#ea580c" stroke-opacity="0.7"/>
  <rect x="98" y="662" width="30" height="24" rx="3" fill="#ffedd5" stroke="#ea580c" stroke-opacity="0.7"/>
  <rect x="130" y="662" width="40" height="24" rx="3" fill="#ffedd5" stroke="#ea580c" stroke-opacity="0.7"/>
  <rect x="172" y="662" width="20" height="24" rx="3" fill="#ffedd5" stroke="#ea580c" stroke-opacity="0.7"/>
  <rect x="196" y="662" width="380" height="24" rx="3" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.7"/>
  <text x="386" y="678" class="c">views 1 to 4: the shadow cascades, 4 regions each</text>
  <rect x="580" y="662" width="40" height="24" rx="3" fill="#fed7aa" stroke="#ea580c" stroke-opacity="0.7"/>
  <rect x="622" y="662" width="20" height="24" rx="3" fill="#fed7aa" stroke="#ea580c" stroke-opacity="0.7"/>
  <rect x="644" y="662" width="30" height="24" rx="3" fill="#fed7aa" stroke="#ea580c" stroke-opacity="0.7"/>
  <rect x="676" y="662" width="20" height="24" rx="3" fill="#fed7aa" stroke="#ea580c" stroke-opacity="0.7"/>
  <text x="117" y="700" class="fs" text-anchor="middle">view 0: camera</text>
  <text x="638" y="700" class="fs" text-anchor="middle">view 5: second phase</text>

  <path d="M42,690 L42,708 H62" fill="none" stroke="#ea580c" stroke-opacity="0.7" stroke-dasharray="3 3"/>
  <rect x="62" y="712" width="54" height="22" rx="3" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.7"/>
  <text x="89" y="727" class="c mono">7, 0</text>
  <rect x="118" y="712" width="54" height="22" rx="3" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.7"/>
  <text x="145" y="727" class="c mono">7, 1</text>
  <rect x="174" y="712" width="54" height="22" rx="3" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.7"/>
  <text x="201" y="727" class="c mono">7, 2</text>
  <rect x="230" y="712" width="54" height="22" rx="3" fill="#ffffff" stroke="#ea580c" stroke-opacity="0.7"/>
  <text x="257" y="727" class="c mono">12, 0</text>
  <text x="298" y="727" class="c">…</text>
  <text x="314" y="720" class="s">work items {instance, meshlet}; beside them one RegionWork per region:</text>
  <text x="314" y="734" class="s">its task workgroups (items / 32) and range. View 5: what the pyramid newly shows.</text>

  <line x1="390" y1="744" x2="390" y2="774" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="402" y="763" class="edge">one drawMeshTasksIndirect per region, its RegionWork</text>

  <!-- 4 Task shader -->
  <rect x="28" y="776" width="724" height="154" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-opacity="0.45"/>
  <text x="44" y="800" class="h">4  Task shader</text>
  <text x="44" y="818" class="s">shaders/meshlet.task; 32 consecutive work items per workgroup, whatever their instance</text>

  <rect x="42" y="830" width="258" height="88" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.6"/>
  <text x="54" y="849" class="t" font-weight="700">Cull each meshlet</text>
  <text x="54" y="866" class="s">sphere against the view's frustum</text>
  <text x="54" y="881" class="s">normal cone: camera, single-sided</text>
  <text x="54" y="896" class="s">sphere's box against the depth pyramid,</text>
  <text x="54" y="911" class="s">in the camera's second phase</text>
  <line x1="300" y1="874" x2="318" y2="874" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="320" y="830" width="190" height="88" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.6"/>
  <text x="332" y="849" class="t" font-weight="700">Compact</text>
  <text x="332" y="866" class="s">survivors in meshlet order,</text>
  <text x="332" y="881" class="s">a prefix over the workgroup:</text>
  <text x="332" y="896" class="s">no atomics, same every run</text>
  <line x1="510" y1="874" x2="528" y2="874" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="530" y="830" width="208" height="88" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.6"/>
  <text x="542" y="849" class="t" font-weight="700">Pack</text>
  <text x="542" y="866" class="s">consecutive survivors, up to</text>
  <text x="542" y="881" class="s">64 vertices and 124 triangles;</text>
  <text x="542" y="896" class="s">a full meshlet takes one alone,</text>
  <text x="542" y="911" class="s">up to 32 small ones share one</text>

  <line x1="390" y1="930" x2="390" y2="960" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="402" y="949" class="edge">EmitMeshTasksEXT: one mesh workgroup per pack</text>

  <!-- 5 Mesh shader -->
  <rect x="28" y="962" width="724" height="124" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-opacity="0.45"/>
  <text x="44" y="986" class="h">5  Mesh shader, rasterizer</text>
  <text x="44" y="1004" class="s">gbuffer.mesh, depth.mesh, depthcutout.mesh, shadow.mesh, shadowcutout.mesh</text>

  <rect x="42" y="1016" width="290" height="58" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.6"/>
  <text x="54" y="1035" class="t" font-weight="700">One workgroup per pack</text>
  <text x="54" y="1052" class="s">64 lanes: a vertex and up to two triangles each,</text>
  <text x="54" y="1066" class="s">pulled from the pool at the mesh's vertexOffset</text>
  <line x1="332" y1="1045" x2="350" y2="1045" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="352" y="1016" width="120" height="58" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="364" y="1041" class="t" font-weight="700">Rasterizer</text>
  <text x="364" y="1058" class="s">in draw order</text>
  <line x1="472" y1="1045" x2="490" y2="1045" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="492" y="1016" width="246" height="58" rx="8" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="504" y="1035" class="t" font-weight="700">G-buffer, shadow atlas, depth</text>
  <text x="504" y="1052" class="s">by the pass: lit later, sampled</text>
  <text x="504" y="1066" class="s">for shadows, or occluders</text>

  <!-- Every mesh pass -->
  <path d="M760,776 H766 V1100 H760" fill="none" stroke="#7c3aed" stroke-opacity="0.7" stroke-width="1.6"/>
  <rect x="776" y="776" width="196" height="324" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.6"/>
  <text x="790" y="800" class="h">Every mesh pass</text>
  <text x="790" y="818" class="s">goes through 4 and 5</text>
  <text x="790" y="844" class="f" font-weight="700">ShadowPass</text>
  <text x="790" y="860" class="s">cascades: views 1 to 4</text>
  <text x="790" y="891" class="f" font-weight="700">DepthPrepass(Late)</text>
  <text x="790" y="907" class="s">only with render.prepass</text>
  <text x="790" y="938" class="f" font-weight="700">GeometryPass(Late)</text>
  <text x="790" y="954" class="s">camera: views 0, then 5</text>
  <text x="790" y="978" class="f" font-weight="700">DebugViewPass</text>
  <text x="790" y="994" class="s">half a meshlet a workgroup,</text>
  <text x="790" y="1008" class="s">no packs</text>
  <line x1="790" y1="1022" x2="958" y2="1022" stroke="#e2e8f0"/>
  <text x="790" y="1040" class="s">Each binds a pipeline per bucket</text>
  <text x="790" y="1054" class="s">and calls drawMeshTasksIndirect</text>
  <text x="790" y="1068" class="s">once per region.</text>

  <!-- Side notes for stages 1 to 3 -->
  <rect x="776" y="88" width="196" height="176" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="790" y="112" class="t" font-weight="700">Test world, flight_10</text>
  <text x="790" y="130" class="s">release, AMD Radeon 890M</text>
  <text x="790" y="158" class="t"><tspan font-weight="700">about 3 million</tspan></text>
  <text x="790" y="174" class="s">draw slots culled every frame</text>
  <text x="790" y="200" class="t"><tspan font-weight="700">4.95 million</tspan></text>
  <text x="790" y="216" class="s">triangles drawn</text>
  <text x="790" y="242" class="t"><tspan font-weight="700">15.2 ms</tspan> GPU frame</text>
  <text x="790" y="256" class="s">48.8 ms with indexed draws</text>

  <rect x="776" y="500" width="196" height="244" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="790" y="524" class="t" font-weight="700">Occlusion, two phases</text>
  <text x="790" y="546" class="s">The camera's first phase draws</text>
  <text x="790" y="561" class="s">what it saw last frame (the</text>
  <text x="790" y="576" class="s">history). HzbBuild makes a</text>
  <text x="790" y="591" class="s">depth pyramid of it, and</text>
  <text x="790" y="606" class="s">InstanceCullOcclusion tests</text>
  <text x="790" y="621" class="s">the rest against it: what</text>
  <text x="790" y="636" class="s">newly shows goes to view 5.</text>
  <text x="790" y="660" class="s">The second phase's task</text>
  <text x="790" y="675" class="s">shaders test each meshlet</text>
  <text x="790" y="690" class="s">against the same pyramid;</text>
  <text x="790" y="705" class="s">the first phase's are not.</text>
  <text x="790" y="729" class="s">By default in the geometry pass.</text>
</svg>
