  <text x="60" y="430" class="s">view 0 camera, views 1–4 cascades</text>
  <text x="60" y="446" class="s">bucket: single, double, ×cutout</text>
  <text x="680" y="330" class="s">instance i of workgroup g, region r:</text>
  <rect x="680" y="340" width="276" height="62" rx="7" fill="#ffffff" stroke="#16a34a" stroke-opacity="0.6"/>
  <text x="690" y="360" class="m">regionOffsets[r]</text>
  <text x="690" y="376" class="m">+ cullGroupOffsets[g][r]</text>
  <text x="690" y="392" class="m">+ local prefix − 1</text>
  <text x="680" y="420" class="s">past the region's end: dropped, counted in</text>
  <text x="680" y="436" class="s"><tspan class="m">regionOverflow</tspan>, traced (CullRegionOverflow)</text>
