<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1f2733; }
    .h { font-size: 14px; font-weight: 700; fill: #1f2733; }
    .lib { font-size: 13.5px; font-weight: 700; fill: #1f2733; font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .f { font-size: 12px; font-weight: 700; fill: #1f2733; font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .t { font-size: 12.5px; fill: #3a4452; }
    .b { font-weight: 700; fill: #1f2733; }
    .s { font-size: 11px; fill: #5a6575; }
    .mono { font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .edge { font-size: 11.5px; font-weight: 600; fill: #334155; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="590" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="28" y="40" class="title">The packed texture format</text>
  <text x="28" y="62" class="s" style="font-size:12px">pack/packedtexture.h: what ngen-packer-texture and ngen-packer-exr write and the engine reads; little-endian.</text>

  <!-- header -->
  <text x="40" y="100" class="h">Header, 28 bytes</text>
  <text x="40" y="124" class="s mono">0</text>
  <rect x="40" y="130" width="131" height="60" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="105.5" y="156" class="f" text-anchor="middle">magic</text>
  <text x="105.5" y="175" class="s" text-anchor="middle">"NGTX"</text>
  <text x="171" y="124" class="s mono">4</text>
  <rect x="171" y="130" width="131" height="60" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="236.5" y="156" class="f" text-anchor="middle">version</text>
  <text x="236.5" y="175" class="s" text-anchor="middle">u32, 2</text>
  <text x="302" y="124" class="s mono">8</text>
  <rect x="302" y="130" width="131" height="60" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="367.5" y="156" class="f" text-anchor="middle">format</text>
  <text x="367.5" y="175" class="s" text-anchor="middle">u32, 1 or 2</text>
  <text x="433" y="124" class="s mono">12</text>
  <rect x="433" y="130" width="131" height="60" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="498.5" y="156" class="f" text-anchor="middle">width</text>
  <text x="498.5" y="175" class="s" text-anchor="middle">u32</text>
  <text x="564" y="124" class="s mono">16</text>
  <rect x="564" y="130" width="131" height="60" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="629.5" y="156" class="f" text-anchor="middle">height</text>
  <text x="629.5" y="175" class="s" text-anchor="middle">u32</text>
  <text x="695" y="124" class="s mono">20</text>
  <rect x="695" y="130" width="131" height="60" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="760.5" y="156" class="f" text-anchor="middle">mipLevels</text>
  <text x="760.5" y="175" class="s" text-anchor="middle">u32</text>
  <text x="826" y="124" class="s mono">24</text>
  <rect x="826" y="130" width="131" height="60" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="891.5" y="156" class="f" text-anchor="middle">irradianceFloats</text>
  <text x="891.5" y="175" class="s" text-anchor="middle">u32, 0 or 27</text>
  <text x="957" y="124" class="s mono" text-anchor="end">28</text>
  <text x="40" y="212" class="s">format: 1 Rgba8Srgb (an image: colour encoded as sRGB, alpha linear), 2 Rgb9e5 (HDR linear radiance).</text>
  <text x="40" y="228" class="s">mipLevels: an image's full chain, floor(log2(max(width, height))) + 1; an HDR lat-long: 1.</text>

  <!-- irradiance and levels -->
  <text x="40" y="268" class="h">Then the irradiance block, when irradianceFloats is 27, and the levels</text>
  <text x="40" y="292" class="s mono">28</text>
  <rect x="40" y="298" width="51" height="60" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="65.5" y="323" class="f" text-anchor="middle">00</text>
  <text x="65.5" y="342" class="s" text-anchor="middle">r g b</text>
  <rect x="91" y="298" width="51" height="60" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="116.5" y="323" class="f" text-anchor="middle">1-1</text>
  <text x="116.5" y="342" class="s" text-anchor="middle">r g b</text>
  <rect x="142" y="298" width="51" height="60" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="167.5" y="323" class="f" text-anchor="middle">10</text>
  <text x="167.5" y="342" class="s" text-anchor="middle">r g b</text>
  <rect x="193" y="298" width="51" height="60" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="218.5" y="323" class="f" text-anchor="middle">11</text>
  <text x="218.5" y="342" class="s" text-anchor="middle">r g b</text>
  <rect x="244" y="298" width="51" height="60" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="269.5" y="323" class="f" text-anchor="middle">2-2</text>
  <text x="269.5" y="342" class="s" text-anchor="middle">r g b</text>
  <rect x="295" y="298" width="51" height="60" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="320.5" y="323" class="f" text-anchor="middle">2-1</text>
  <text x="320.5" y="342" class="s" text-anchor="middle">r g b</text>
  <rect x="346" y="298" width="51" height="60" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="371.5" y="323" class="f" text-anchor="middle">20</text>
  <text x="371.5" y="342" class="s" text-anchor="middle">r g b</text>
  <rect x="397" y="298" width="51" height="60" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="422.5" y="323" class="f" text-anchor="middle">21</text>
  <text x="422.5" y="342" class="s" text-anchor="middle">r g b</text>
  <rect x="448" y="298" width="51" height="60" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="473.5" y="323" class="f" text-anchor="middle">22</text>
  <text x="473.5" y="342" class="s" text-anchor="middle">r g b</text>
  <text x="516" y="292" class="s mono">28 + 4 × irradianceFloats</text>
  <rect x="516" y="298" width="220" height="60" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="626" y="333" class="f" text-anchor="middle">level 0</text>
  <rect x="736" y="298" width="110" height="60" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="791" y="333" class="f" text-anchor="middle">level 1</text>
  <rect x="846" y="298" width="55" height="60" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="873.5" y="333" class="f" text-anchor="middle">2</text>
  <rect x="901" y="298" width="56" height="60" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="929" y="333" class="t" text-anchor="middle">…</text>
  <text x="40" y="378" class="s">27 f32: 9 spherical-harmonic coefficients (bands 0 to 2), rgb</text>
  <text x="40" y="394" class="s">each, convolved with the cosine lobe, pole +Z; ngen-packer-exr writes it</text>
  <text x="516" y="378" class="s">every level, level 0 first, tightly packed, 4 bytes a texel;</text>
  <text x="516" y="394" class="s">level n is max(1, width &gt;&gt; n) × max(1, height &gt;&gt; n) texels</text>

  <!-- an Rgb9e5 texel -->
  <text x="40" y="440" class="h">An Rgb9e5 texel: one u32, Vulkan's E5B9G9R9_UFLOAT_PACK32</text>
  <rect x="52" y="474" width="140" height="50" rx="0" fill="#f1f5f9" stroke="#64748b" stroke-opacity="0.6"/>
  <line x1="164" y1="476" x2="164" y2="484" stroke="#94a3b8" stroke-width="1"/>
  <line x1="136" y1="476" x2="136" y2="484" stroke="#94a3b8" stroke-width="1"/>
  <line x1="108" y1="476" x2="108" y2="484" stroke="#94a3b8" stroke-width="1"/>
  <line x1="80" y1="476" x2="80" y2="484" stroke="#94a3b8" stroke-width="1"/>
  <text x="122" y="501" class="f" text-anchor="middle">shared exponent</text>
  <text x="122" y="516" class="s" text-anchor="middle">bits 27–31</text>
  <text x="66" y="466" class="s mono" text-anchor="middle">31</text>
  <text x="178" y="466" class="s mono" text-anchor="middle">27</text>
  <rect x="192" y="474" width="252" height="50" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <line x1="416" y1="476" x2="416" y2="484" stroke="#94a3b8" stroke-width="1"/>
  <line x1="388" y1="476" x2="388" y2="484" stroke="#94a3b8" stroke-width="1"/>
  <line x1="360" y1="476" x2="360" y2="484" stroke="#94a3b8" stroke-width="1"/>
  <line x1="332" y1="476" x2="332" y2="484" stroke="#94a3b8" stroke-width="1"/>
  <line x1="304" y1="476" x2="304" y2="484" stroke="#94a3b8" stroke-width="1"/>
  <line x1="276" y1="476" x2="276" y2="484" stroke="#94a3b8" stroke-width="1"/>
  <line x1="248" y1="476" x2="248" y2="484" stroke="#94a3b8" stroke-width="1"/>
  <line x1="220" y1="476" x2="220" y2="484" stroke="#94a3b8" stroke-width="1"/>
  <text x="318" y="501" class="f" text-anchor="middle">B mantissa</text>
  <text x="318" y="516" class="s" text-anchor="middle">bits 18–26</text>
  <text x="206" y="466" class="s mono" text-anchor="middle">26</text>
  <text x="430" y="466" class="s mono" text-anchor="middle">18</text>
  <rect x="444" y="474" width="252" height="50" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <line x1="668" y1="476" x2="668" y2="484" stroke="#94a3b8" stroke-width="1"/>
  <line x1="640" y1="476" x2="640" y2="484" stroke="#94a3b8" stroke-width="1"/>
  <line x1="612" y1="476" x2="612" y2="484" stroke="#94a3b8" stroke-width="1"/>
  <line x1="584" y1="476" x2="584" y2="484" stroke="#94a3b8" stroke-width="1"/>
  <line x1="556" y1="476" x2="556" y2="484" stroke="#94a3b8" stroke-width="1"/>
  <line x1="528" y1="476" x2="528" y2="484" stroke="#94a3b8" stroke-width="1"/>
  <line x1="500" y1="476" x2="500" y2="484" stroke="#94a3b8" stroke-width="1"/>
  <line x1="472" y1="476" x2="472" y2="484" stroke="#94a3b8" stroke-width="1"/>
  <text x="570" y="501" class="f" text-anchor="middle">G mantissa</text>
  <text x="570" y="516" class="s" text-anchor="middle">bits 9–17</text>
  <text x="458" y="466" class="s mono" text-anchor="middle">17</text>
  <text x="682" y="466" class="s mono" text-anchor="middle">9</text>
  <rect x="696" y="474" width="252" height="50" rx="0" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <line x1="920" y1="476" x2="920" y2="484" stroke="#94a3b8" stroke-width="1"/>
  <line x1="892" y1="476" x2="892" y2="484" stroke="#94a3b8" stroke-width="1"/>
  <line x1="864" y1="476" x2="864" y2="484" stroke="#94a3b8" stroke-width="1"/>
  <line x1="836" y1="476" x2="836" y2="484" stroke="#94a3b8" stroke-width="1"/>
  <line x1="808" y1="476" x2="808" y2="484" stroke="#94a3b8" stroke-width="1"/>
  <line x1="780" y1="476" x2="780" y2="484" stroke="#94a3b8" stroke-width="1"/>
  <line x1="752" y1="476" x2="752" y2="484" stroke="#94a3b8" stroke-width="1"/>
  <line x1="724" y1="476" x2="724" y2="484" stroke="#94a3b8" stroke-width="1"/>
  <text x="822" y="501" class="f" text-anchor="middle">R mantissa</text>
  <text x="822" y="516" class="s" text-anchor="middle">bits 0–8</text>
  <text x="710" y="466" class="s mono" text-anchor="middle">8</text>
  <text x="934" y="466" class="s mono" text-anchor="middle">0</text>
  <text x="40" y="552" class="t">channel = mantissa × 2^(exponent − 15 − 9): exponent bias 15, chosen for the largest channel; values clamp to 0 … 65408.</text>
  <text x="40" y="570" class="s">An Rgba8Srgb texel is 4 bytes: R, G, B, A.</text>
</svg>
