<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="672" viewBox="0 0 1000 672" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1f2733; }
    .h { font-size: 15px; font-weight: 700; fill: #1f2733; }
    .sec { font-size: 13px; font-weight: 700; fill: #1f2733; }
    .lib { font-size: 13.5px; font-weight: 700; fill: #1f2733; font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .t { font-size: 12.5px; fill: #3a4452; }
    .s { font-size: 11px; fill: #5a6575; }
    .m { font-size: 11px; fill: #3a4452; font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .f { font-size: 12px; font-weight: 700; fill: #1f2733; font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .n { font-size: 13px; font-weight: 700; }
    .edge { font-size: 11.5px; fill: #334155; font-weight: 600; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="672" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="28" y="40" class="title">ngen-build: bootstrap and execution flow</text>
  <text x="28" y="62" class="s" style="font-size:12px">One seed compile makes ngen-build; every run rebuilds the build system's own binaries if stale, emits the project IR, then executes it.</text>

  <!-- Seed -->
  <rect x="28" y="86" width="944" height="88" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-opacity="0.45"/>
  <text x="44" y="110" class="h">Once, on a fresh clone</text>
  <text x="44" y="136" class="m">mkdir -p _out &amp;&amp; c++ -std=c++23 -O0 -g -pthread -o _out/ngen-build src/build/bootstrap.cpp</text>
  <text x="44" y="158" class="s">again when bootstrap.cpp or what it includes changes, such as the IR format in ir/schema.hpp</text>
  <line x1="704" y1="132" x2="752" y2="132" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="756" y="112" width="200" height="40" rx="7" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="770" y="137" class="f">_out/ngen-build</text>

  <text x="28" y="206" class="sec">Every run of ngen-build -p &lt;platform&gt; -c &lt;config&gt; [targets]</text>
  <text x="660" y="206" class="sec">Files under _out/</text>

  <!-- 1: ngen-build process -->
  <rect x="28" y="218" width="580" height="222" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.45"/>
  <text x="44" y="242" class="n" fill="#2563eb">1</text>
  <text x="62" y="242" class="lib">ngen-build</text>
  <text x="156" y="242" class="s">self-build, in this process (bootstrap.cpp)</text>
  <rect x="44" y="256" width="548" height="96" rx="8" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.6"/>
  <text x="58" y="277" class="lib">self_build_ir()</text>
  <text x="196" y="277" class="s">an IR in memory with two edges, never written to disk</text>
  <rect x="58" y="290" width="256" height="48" rx="6" fill="#f1f5f9"/>
  <text x="70" y="309" class="m">build.cpp</text>
  <text x="70" y="327" class="m">→ _out/ngen-build-graph</text>
  <rect x="324" y="290" width="254" height="48" rx="6" fill="#f1f5f9"/>
  <text x="336" y="309" class="m">src/build/run/main.cpp</text>
  <text x="336" y="327" class="m">→ _out/ngen-build-run</text>
  <line x1="318" y1="352" x2="318" y2="368" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="44" y="370" width="548" height="56" rx="8" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.6"/>
  <text x="58" y="392" class="lib">ngen::run::execute(ir, opts)</text>
  <text x="58" y="412" class="s">the runner library, in-process: recompiles a binary only when its sources or headers changed</text>

  <line x1="318" y1="440" x2="318" y2="460" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 2: graph stage -->
  <rect x="28" y="462" width="580" height="74" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-opacity="0.45"/>
  <text x="44" y="486" class="n" fill="#db2777">2</text>
  <text x="62" y="486" class="lib">./_out/ngen-build-graph</text>
  <text x="270" y="486" class="s">subprocess</text>
  <text x="62" y="506" class="s">build.cpp's Project, walked by ir::Emitter: one IR for every platform × config</text>
  <text x="62" y="522" class="s">--list, --dump-graph and --compile-commands stop here</text>

  <line x1="318" y1="536" x2="318" y2="556" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 3: project run -->
  <rect x="28" y="558" width="580" height="90" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-opacity="0.45"/>
  <text x="44" y="582" class="n" fill="#db2777">3</text>
  <text x="62" y="582" class="lib">./_out/ngen-build-run --ir … [targets]</text>
  <text x="62" y="602" class="s">subprocess; targets resolved first with ir::resolve_target (exact names, then fuzzy)</text>
  <text x="62" y="618" class="s">ngen::run::execute again: dirty set by content hash, parallel scheduler,</text>
  <text x="62" y="634" class="s">depfile headers, build log</text>

  <!-- Files -->
  <rect x="660" y="330" width="312" height="52" rx="7" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="674" y="351" class="f">_out/ngen-build-graph</text>
  <text x="674" y="371" class="f">_out/ngen-build-run</text>
  <path d="M592,384 L626,384 L626,356 L656,356" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="660" y="394" width="312" height="52" rx="7" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="674" y="415" class="f">_out/.system/.ngen-buildlog</text>
  <text x="674" y="434" class="s">the self-build's log</text>
  <line x1="592" y1="414" x2="656" y2="414" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="660" y="472" width="312" height="52" rx="7" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="674" y="493" class="f">_out/&lt;plat&gt;/&lt;cfg&gt;/build.ngenir</text>
  <text x="674" y="512" class="s">binary IR, commands fully baked</text>
  <line x1="608" y1="498" x2="656" y2="498" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="660" y="590" width="312" height="52" rx="7" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="674" y="611" class="f">_out/&lt;plat&gt;/&lt;cfg&gt;/.ngen-buildlog</text>
  <text x="674" y="630" class="s">the project build's log</text>
  <line x1="608" y1="616" x2="656" y2="616" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <path d="M700,524 L700,568 L612,568" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="708" y="552" class="edge">read by step 3</text>
</svg>
