<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1104" viewBox="0 0 1000 1104" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1f2733; }
    .h { font-size: 14px; font-weight: 700; fill: #1f2733; }
    .lib { font-size: 13.5px; font-weight: 700; fill: #1f2733; font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .f { font-size: 12px; font-weight: 700; fill: #1f2733; font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .t { font-size: 12.5px; fill: #3a4452; }
    .b { font-weight: 700; fill: #1f2733; }
    .s { font-size: 11px; fill: #5a6575; }
    .mono { font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .edge { font-size: 11.5px; font-weight: 600; fill: #334155; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1104" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="28" y="40" class="title">The asset server: a request</text>
  <text x="28" y="62" class="s" style="font-size:12px">One asset.request from AssetClient; each asset is answered on its own, packed by a packer process when its cache is out of date.</text>

  <!-- per-asset band -->
  <rect x="28" y="236" width="944" height="572" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-opacity="0.45"/>

  <!-- lifelines -->
  <line x1="150" y1="136" x2="150" y2="1082" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="500" y1="136" x2="500" y2="1082" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="850" y1="136" x2="850" y2="1082" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- participants -->
  <rect x="35" y="88" width="230" height="48" rx="8" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.6"/>
  <text x="150" y="110" class="lib" text-anchor="middle">AssetClient</text>
  <text x="150" y="127" class="s" text-anchor="middle">in ngen-view, ngen-pack, ngen-packdump</text>
  <rect x="385" y="88" width="230" height="48" rx="8" fill="#ffffff" stroke="#db2777" stroke-opacity="0.6"/>
  <text x="500" y="110" class="lib" text-anchor="middle">ngen-asset-server</text>
  <text x="500" y="127" class="s" text-anchor="middle">a worker per hardware thread</text>
  <rect x="735" y="88" width="230" height="48" rx="8" fill="#ffffff" stroke="#db2777" stroke-opacity="0.6"/>
  <text x="850" y="110" class="lib" text-anchor="middle">ngen-packer-&lt;type&gt;</text>
  <text x="850" y="127" class="s" text-anchor="middle">a process per job, no shell</text>

  <!-- the request -->
  <text x="162" y="170" class="edge mono">asset.request {ids, have, force}</text>
  <line x1="150" y1="178" x2="498" y2="178" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="488" y="210" class="edge mono" text-anchor="end">{request}</text>
  <text x="162" y="210" class="s">answered at once</text>
  <line x1="500" y1="218" x2="152" y2="218" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="162" y="258" class="s">then each asset on its own, as it finishes:</text>

  <!-- cache check -->
  <rect x="390" y="268" width="220" height="32" rx="8" fill="#ffffff" stroke="#db2777" stroke-opacity="0.6"/>
  <text x="500" y="289" class="t mono" text-anchor="middle" style="font-size:12px">cache.upToDate(id, jobKey)</text>
  <text x="378" y="289" class="s" text-anchor="end">the job key, then every file</text>

  <!-- out of date: the packer runs -->
  <rect x="372" y="316" width="594" height="228" rx="8" fill="none" stroke="#db2777" stroke-opacity="0.6"/>
  <path d="M372,336 L372,324 Q372,316 380,316 L478,316 L478,330 L470,336 Z" fill="#fdf2f8" stroke="#db2777" stroke-opacity="0.6"/>
  <text x="382" y="331" class="s b">out of date</text>
  <text x="512" y="352" class="edge">runs the rule's packer, with</text>
  <text x="512" y="367" class="s mono">--rule --rule-version --asset --source</text>
  <text x="512" y="381" class="s mono">--out --depfile [--param key=value]...</text>
  <line x1="500" y1="392" x2="848" y2="392" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="745" y="408" width="210" height="46" rx="8" fill="#ffffff" stroke="#db2777" stroke-opacity="0.6"/>
  <text x="850" y="427" class="s" text-anchor="middle">writes --out and the depfile;</text>
  <text x="850" y="442" class="s" text-anchor="middle">USD: secondary outputs too</text>
  <text x="838" y="478" class="edge" text-anchor="end">exit 0, or nonzero and its output</text>
  <line x1="850" y1="486" x2="502" y2="486" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <rect x="400" y="500" width="200" height="30" rx="8" fill="#ffffff" stroke="#db2777" stroke-opacity="0.6"/>
  <text x="500" y="520" class="t" text-anchor="middle">record it in the cache</text>

  <!-- data -->
  <text x="162" y="566" class="edge mono">asset.data</text>
  <text x="162" y="580" class="s mono">{request, id, version, offset, total}</text>
  <line x1="500" y1="590" x2="152" y2="590" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="500" y1="604" x2="152" y2="604" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="500" y1="618" x2="152" y2="618" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="162" y="636" class="s">each with up to 1 MiB of the packed file</text>
  <text x="162" y="650" class="s">as the frame's attachment, in order</text>
  <rect x="524" y="568" width="300" height="58" rx="8" fill="#ffffff" stroke="#64748b" stroke-opacity="0.6"/>
  <text x="538" y="587" class="s">chunks of different assets interleave;</text>
  <text x="538" y="601" class="s">at most 8 MiB is queued on a connection,</text>
  <text x="538" y="615" class="s">the next chunk goes as the queue drains</text>

  <!-- ready -->
  <text x="162" y="676" class="edge mono">asset.ready</text>
  <text x="162" y="690" class="s mono">{request, id, version, size, sent, packed, ms}</text>
  <line x1="500" y1="700" x2="152" y2="700" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="524" y="690" class="s">sent: true; packed: a packer ran for it;</text>
  <text x="524" y="704" class="s">ms: the server's time for it, waiting included</text>

  <!-- failed -->
  <text x="162" y="728" class="edge mono">or asset.failed</text>
  <text x="162" y="742" class="s mono">{request, id, errors, ms}</text>
  <line x1="500" y1="752" x2="152" y2="752" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="524" y="742" class="s">no rule, no such file, the packer failed, or</text>
  <text x="524" y="756" class="s">a &lt;file&gt;#&lt;fragment&gt; its job didn't write</text>

  <!-- held -->
  <text x="162" y="780" class="edge mono">asset.ready {sent: false}</text>
  <line x1="500" y1="790" x2="152" y2="790" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="524" y="786" class="s">an id whose have version is current: no data</text>

  <!-- later: a change -->
  <line x1="28" y1="836" x2="972" y2="836" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="162" y="828" class="s b">later: a file it was packed from changes</text>
  <rect x="360" y="852" width="280" height="62" rx="8" fill="#ffffff" stroke="#db2777" stroke-opacity="0.6"/>
  <text x="500" y="872" class="t b" text-anchor="middle">FileWatcher</text>
  <text x="500" y="889" class="s" text-anchor="middle">its directory is watched (inotify, or polled);</text>
  <text x="500" y="903" class="s" text-anchor="middle">100 ms gathered, then the up-to-date test</text>
  <text x="162" y="946" class="edge mono">asset.changed {ids}</text>
  <line x1="500" y1="956" x2="152" y2="956" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="162" y="974" class="s">to each connection holding an id now out of date;</text>
  <text x="162" y="988" class="s">the server packs nothing for it</text>
  <rect x="35" y="1002" width="230" height="30" rx="8" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.6"/>
  <text x="150" y="1021" class="s" text-anchor="middle">takeChanged(): marked stale</text>
  <text x="162" y="1058" class="edge mono">asset.request {ids, have}</text>
  <line x1="150" y1="1066" x2="498" y2="1066" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="162" y="1084" class="s">the view asks again; packing happens on request only</text>
</svg>
