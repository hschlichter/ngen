<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="920" height="410" font-family="Helvetica, Arial, sans-serif">
  <style>
    .grid { stroke: #e3e7ec; stroke-width: 1; }
    .axis { stroke: #6b7684; stroke-width: 1.2; }
    .tick { font-size: 11px; fill: #4a5462; text-anchor: end; }
    .bar { fill: #4f86e0; }
    .last { fill: #2f6fd6; }
    .value { font-size: 12px; font-weight: bold; fill: #1d232b; text-anchor: middle; }
    .xl { font-size: 11.5px; fill: #333b45; text-anchor: middle; }
    .ref { stroke-width: 1.4; stroke-dasharray: 6 4; }
  </style>
  <rect x="0" y="0" width="920" height="410" fill="#ffffff"/>
  <text x="70" y="18" font-size="13" font-weight="bold" fill="#1d232b">Frame GPU time at flight_10 after each step (ms)</text>

  <!-- Grid: 0..70 ms over y 330..30, 4.2857 px per ms -->
  <line class="grid" x1="70" y1="287.1" x2="900" y2="287.1"/>
  <line class="grid" x1="70" y1="244.3" x2="900" y2="244.3"/>
  <line class="grid" x1="70" y1="201.4" x2="900" y2="201.4"/>
  <line class="grid" x1="70" y1="158.6" x2="900" y2="158.6"/>
  <line class="grid" x1="70" y1="115.7" x2="900" y2="115.7"/>
  <line class="grid" x1="70" y1="72.9" x2="900" y2="72.9"/>
  <line class="grid" x1="70" y1="30" x2="900" y2="30"/>
  <text class="tick" x="62" y="334">0</text>
  <text class="tick" x="62" y="291">10</text>
  <text class="tick" x="62" y="248">20</text>
  <text class="tick" x="62" y="205">30</text>
  <text class="tick" x="62" y="162">40</text>
  <text class="tick" x="62" y="119">50</text>
  <text class="tick" x="62" y="77">60</text>
  <text class="tick" x="62" y="34">70</text>

  <!-- Bars -->
  <rect class="bar" x="94" y="34.7" width="70" height="295.3"/>
  <text class="value" x="129" y="52" style="fill:#ffffff">68.9</text>
  <rect class="bar" x="212.6" y="174.0" width="70" height="156.0"/>
  <text class="value" x="247.6" y="167">36.4</text>
  <rect class="bar" x="331.2" y="197.1" width="70" height="132.9"/>
  <text class="value" x="366.2" y="190">31.0</text>
  <rect class="bar" x="449.8" y="211.3" width="70" height="118.7"/>
  <text class="value" x="484.8" y="204">27.7</text>
  <rect class="bar" x="568.4" y="232.7" width="70" height="97.3"/>
  <text class="value" x="603.4" y="226">22.7</text>
  <rect class="bar" x="687" y="244.7" width="70" height="85.3"/>
  <text class="value" x="722" y="238">19.9</text>
  <rect class="last" x="805.6" y="264.4" width="70" height="65.6"/>
  <text class="value" x="840.6" y="276" style="fill:#ffffff">15.3</text>

  <!-- Reference lines -->
  <line class="ref" x1="70" y1="120.9" x2="900" y2="120.9" stroke="#c0392b"/>
  <text x="895" y="114" font-size="11.5" fill="#c0392b" text-anchor="end">main (indexed draws): 48.8 ms</text>
  <line class="ref" x1="70" y1="258.4" x2="900" y2="258.4" stroke="#3c9a55"/>
  <text x="895" y="253" font-size="11.5" fill="#3c9a55" text-anchor="end">60 fps: 16.7 ms</text>

  <line class="axis" x1="70" y1="330" x2="900" y2="330"/>
  <line class="axis" x1="70" y1="30" x2="70" y2="330"/>

  <!-- X labels -->
  <text class="xl" x="129" y="350">start</text>
  <text class="xl" x="129" y="365">(occlusion in</text>
  <text class="xl" x="129" y="380">the prepass)</text>
  <text class="xl" x="247.6" y="350">1 skip empty</text>
  <text class="xl" x="247.6" y="365">regions, slots</text>
  <text class="xl" x="366.2" y="350">2 parallel</text>
  <text class="xl" x="366.2" y="365">scan</text>
  <text class="xl" x="484.8" y="350">3 box per</text>
  <text class="xl" x="484.8" y="365">256 slots</text>
  <text class="xl" x="603.4" y="350">4 occlusion in</text>
  <text class="xl" x="603.4" y="365">geometry pass</text>
  <text class="xl" x="722" y="350">5 packed</text>
  <text class="xl" x="722" y="365">meshlets</text>
  <text class="xl" x="840.6" y="350">6 slim culling</text>
  <text class="xl" x="840.6" y="365">record</text>
  <text x="70" y="402" font-size="11" fill="#6b7684">Release, AMD Radeon 890M, 2560×1440, median of 60 frames at frame 300. Each step includes the ones before it.</text>
</svg>
