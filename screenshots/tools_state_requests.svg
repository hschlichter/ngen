<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="672" viewBox="0 0 1000 672" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1f2733; }
    .layer { font-size: 15px; font-weight: 700; }
    .lib { font-size: 13.5px; font-weight: 700; fill: #1f2733; font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .s { font-size: 11px; fill: #5a6575; }
    .t { font-size: 12.5px; fill: #3a4452; }
    .code { font-size: 11px; fill: #334155; font-family: JetBrains Mono, Consolas, Menlo, monospace; }
    .edge { font-size: 11px; fill: #334155; font-weight: 600; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="672" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="28" y="40" class="title">Tools: state the hooks fill, requests the windows leave</text>
  <text x="28" y="62" class="s" style="font-size:12px">A window never calls the engine: it reads a tool's state and writes request fields, which ToolsHooks carries out in the frame.</text>

  <!-- UI -->
  <rect x="28" y="88" width="944" height="136" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-opacity="0.45"/>
  <text x="44" y="116" class="layer" fill="#db2777">UI</text>
  <text x="44" y="134" class="s">src/ui</text>

  <rect x="196" y="104" width="400" height="104" rx="8" fill="#ffffff" stroke="#db2777" stroke-opacity="0.6"/>
  <text x="210" y="126" class="lib">drawLodWindow</text>
  <text x="322" y="126" class="s">and the Streaming window alike</text>
  <text x="210" y="146" class="t">draws the tool's state, writes requests</text>
  <text x="210" y="166" class="code">(show, LodToolState&amp;, LodWindowState&amp;)</text>
  <text x="210" y="186" class="s">keeps only its own state: LodWindowState</text>
  <text x="210" y="201" class="s">(scroll, edit buffers)</text>

  <rect x="652" y="104" width="304" height="104" rx="8" fill="#ffffff" stroke="#db2777" stroke-opacity="0.6"/>
  <text x="666" y="126" class="lib">UiHooks::drawUi</text>
  <text x="666" y="146" class="t">wraps ToolsHooks at every hook</text>
  <text x="666" y="166" class="s">ImGui frame, the windows drawn (ui.draw),</text>
  <text x="666" y="181" class="s">then tools.drawUi(frame); tells the tools</text>
  <text x="666" y="196" class="s">which windows are open (windowOpen)</text>

  <!-- Tools -->
  <rect x="28" y="236" width="944" height="294" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-opacity="0.45"/>
  <text x="44" y="264" class="layer" fill="#7c3aed">Tools</text>
  <text x="44" y="282" class="s">src/tools</text>
  <text x="44" y="306" class="s">includes nothing</text>
  <text x="44" y="321" class="s">from src/ui</text>

  <rect x="196" y="252" width="400" height="164" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.6"/>
  <text x="210" y="274" class="lib">LodToolState</text>
  <text x="322" y="274" class="s">in ToolsState, owned by src/apps/view.cpp</text>
  <line x1="396" y1="288" x2="396" y2="404" stroke="#ddd6fe"/>
  <text x="210" y="300" class="t" font-weight="700">filled by the hooks</text>
  <text x="210" y="320" class="code">rows</text>
  <text x="210" y="336" class="code">inspection</text>
  <text x="210" y="352" class="code">heuristic, blending</text>
  <text x="210" y="368" class="code">levelView</text>
  <text x="210" y="384" class="code">renderLod</text>
  <text x="210" y="400" class="code">selectedRoot</text>
  <text x="410" y="300" class="t" font-weight="700">requests, by the window</text>
  <text x="410" y="320" class="code">levelRequests</text>
  <text x="410" y="336" class="code">frameRequested</text>
  <text x="410" y="352" class="code">selectRequested</text>
  <text x="410" y="368" class="code">heuristicRequested</text>
  <text x="410" y="384" class="code">biasRequested</text>
  <text x="410" y="400" class="code">levelViewRequested, …</text>

  <rect x="652" y="252" width="304" height="164" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.6"/>
  <text x="666" y="274" class="lib">ToolsHooks::drawUi</text>
  <text x="666" y="294" class="t">syncLodTool, syncStreamingTool</text>
  <text x="666" y="316" class="s">takes each request and clears it:</text>
  <text x="666" y="334" class="code">std::exchange(lod.frameRequested,</text>
  <text x="680" y="350" class="code">std::nullopt)</text>
  <text x="666" y="370" class="s">carries it out: scene.setLodLevel,</text>
  <text x="666" y="385" class="s">frame.selectedPath, frame.cam.frame</text>
  <text x="666" y="404" class="s">then refills what the window shows</text>

  <rect x="196" y="432" width="400" height="82" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.6"/>
  <text x="210" y="454" class="lib">ToolsHooks::fillSnapshot</text>
  <text x="210" y="474" class="t">the gizmos' lines as a GizmoFrame</text>
  <text x="210" y="494" class="s">the axis gizmo in its corner, the active tool's gizmo on</text>
  <text x="210" y="508" class="s">the selection; made on the main thread</text>

  <rect x="652" y="432" width="304" height="82" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.6"/>
  <text x="666" y="454" class="lib">GizmoRender</text>
  <text x="666" y="474" class="t">a render extension, render thread</text>
  <text x="666" y="494" class="s">addOverlayPasses: GizmoPass after</text>
  <text x="666" y="508" class="s">the debug lines</text>

  <!-- Engine -->
  <rect x="28" y="542" width="944" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.45"/>
  <text x="44" y="570" class="layer" fill="#2563eb">Engine</text>
  <text x="44" y="588" class="s">src/view, src/renderer</text>

  <rect x="196" y="558" width="400" height="78" rx="8" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.6"/>
  <text x="210" y="580" class="lib">RenderSnapshot</text>
  <text x="210" y="600" class="t">ViewFrame::buildSnapshot, then each hook's fillSnapshot</text>
  <text x="210" y="620" class="s">submitted to the render thread, one a frame</text>

  <rect x="652" y="558" width="304" height="78" rx="8" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.6"/>
  <text x="666" y="580" class="lib">Renderer::render</text>
  <text x="666" y="600" class="t">render thread</text>
  <text x="666" y="620" class="s">calls each RenderExtension's hooks</text>

  <!-- Arrows -->
  <line x1="300" y1="250" x2="300" y2="210" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="308" y="234" class="edge">1 reads</text>
  <line x1="496" y1="208" x2="496" y2="250" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="504" y="234" class="edge">2 writes requests</text>
  <line x1="804" y1="208" x2="804" y2="250" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="812" y="234" class="edge">calls</text>
  <line x1="596" y1="368" x2="650" y2="368" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="623" y="360" class="edge" text-anchor="middle">3 take</text>
  <line x1="650" y1="300" x2="598" y2="300" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="623" y="292" class="edge" text-anchor="middle">4 refill</text>
  <line x1="396" y1="514" x2="396" y2="556" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="404" y="538" class="edge">GizmoFrame</text>
  <line x1="596" y1="597" x2="650" y2="597" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="804" y1="556" x2="804" y2="516" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="812" y="540" class="edge">its hooks</text>
</svg>
