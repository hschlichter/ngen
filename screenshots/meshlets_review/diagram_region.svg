<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1490 150" width="1490" height="150" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5462"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #6b7684; stroke-width: 1.2; }
      .gpu { fill: #e3eeff; stroke: #2f6fd6; stroke-width: 1.6; }
      .title { font-size: 13px; font-weight: bold; fill: #1d232b; text-anchor: middle; }
      .body { font-size: 11.5px; fill: #333b45; text-anchor: middle; }
      .label { font-size: 11px; fill: #4a5462; font-style: italic; text-anchor: middle; }
      .edge { stroke: #4a5462; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="0" y="0" width="1490" height="150" fill="#ffffff"/>

  <rect class="box" x="10" y="25" width="190" height="100" rx="6"/>
  <text class="title" x="105" y="62">Instance slots</text>
  <text class="body" x="105" y="80">3 M on the test world</text>
  <text class="body" x="105" y="96">(GpuCullRecord each)</text>

  <rect class="gpu" x="330" y="25" width="190" height="100" rx="6"/>
  <text class="title" x="425" y="48">Work items, region (v, b)</text>
  <text class="body" x="425" y="66">{instance, meshlet} for</text>
  <text class="body" x="425" y="82">every meshlet of every</text>
  <text class="body" x="425" y="98">drawn instance, in</text>
  <text class="body" x="425" y="114">instance order</text>

  <rect class="gpu" x="650" y="25" width="190" height="100" rx="6"/>
  <text class="title" x="745" y="48">Task workgroup</text>
  <text class="body" x="745" y="66">32 work items, 1 per lane:</text>
  <text class="body" x="745" y="82">sphere vs frustum,</text>
  <text class="body" x="745" y="98">normal cone; phase 2:</text>
  <text class="body" x="745" y="114">box vs depth pyramid</text>

  <rect class="gpu" x="970" y="25" width="190" height="100" rx="6"/>
  <text class="title" x="1065" y="56">Packs</text>
  <text class="body" x="1065" y="74">consecutive survivors,</text>
  <text class="body" x="1065" y="90">at most 64 vertices</text>
  <text class="body" x="1065" y="106">and 124 triangles</text>

  <rect class="gpu" x="1290" y="25" width="190" height="100" rx="6"/>
  <text class="title" x="1385" y="56">Mesh workgroup</text>
  <text class="body" x="1385" y="74">one per pack, 64 lanes:</text>
  <text class="body" x="1385" y="90">a vertex and up to</text>
  <text class="body" x="1385" y="106">two triangles each</text>

  <path class="edge" d="M200,75 H328"/>
  <text class="label" x="265" y="60">5 · cull: visible in</text>
  <text class="label" x="265" y="95">view v, bucket b</text>

  <path class="edge" d="M520,75 H648"/>
  <text class="label" x="585" y="60">RegionWork:</text>
  <text class="label" x="585" y="95">ceil(items / 32) groups</text>

  <path class="edge" d="M840,75 H968"/>
  <text class="label" x="905" y="60">ordered compaction</text>
  <text class="label" x="905" y="95">+ greedy packing</text>

  <path class="edge" d="M1160,75 H1288"/>
  <text class="label" x="1225" y="60">EmitMeshTasksEXT</text>
  <text class="label" x="1225" y="95">(packs)</text>

  <text x="10" y="16" font-size="11" fill="#6b7684">One region = one view × one bucket = one drawMeshTasksIndirect call. Blue: on the GPU, per frame.</text>
</svg>
